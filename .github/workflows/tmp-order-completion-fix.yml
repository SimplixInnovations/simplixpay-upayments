name: Temporary Order Completion Fix Applicator

on:
  push:
    branches: [audit/post-t3-ecosystem-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0

      - name: Apply exact guarded correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          gateway_path = Path('UPayments.php')
          architecture_path = Path('tests/harness/architecture-foundation-harness.php')
          gateway = gateway_path.read_bytes()

          git_blob_sha = hashlib.sha1(b'blob ' + str(len(gateway)).encode() + b'\0' + gateway).hexdigest()
          expected_blob_sha = 'f52dc13612b2cb152140b1d292a14296dae1f47f'
          if git_blob_sha != expected_blob_sha:
              raise SystemExit(f'Unexpected UPayments.php preimage: {git_blob_sha}')

          text = gateway.decode('utf-8')
          old_assignment = "            $this->isOrderComplete = $this->get_option('is_order_complete');"
          new_assignment = """            $this->isOrderComplete = array_key_exists('is_order_complete', $this->settings)
              ? $this->settings['is_order_complete']
              : 'yes';"""
          old_helper = """        public function getIsOrderComplete() {  
            $flag = true;   
            if ($this->isOrderComplete == 'no') { 
                $flag = false;  
            }   
            return $flag;   
        }"""
          new_helper = """        public function getIsOrderComplete() {
            return $this->isOrderComplete === 'yes';
        }"""

          if text.count(old_assignment) != 1:
              raise SystemExit('Expected exactly one is_order_complete assignment preimage')
          if text.count(old_helper) != 1:
              raise SystemExit('Expected exactly one getIsOrderComplete helper preimage')

          text = text.replace(old_assignment, new_assignment, 1)
          text = text.replace(old_helper, new_helper, 1)
          new_gateway = text.encode('utf-8')
          gateway_path.write_bytes(new_gateway)

          architecture = architecture_path.read_text(encoding='utf-8')
          old_ratchet = '$acceptedGatewayBytes = 86212;'
          new_ratchet = f'$acceptedGatewayBytes = {len(new_gateway)};'
          if architecture.count(old_ratchet) != 1:
              raise SystemExit('Expected exactly one architecture byte-ratchet preimage')
          architecture_path.write_text(architecture.replace(old_ratchet, new_ratchet, 1), encoding='utf-8')

          print(f'UPayments.php bytes: {len(gateway)} -> {len(new_gateway)}')
          print(f'UPayments.php Git blob: {git_blob_sha}')
          PY

          php -l UPayments.php
          php tests/harness/architecture-foundation-harness.php
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "UPayments.php"
          test "${changed[1]}" = "tests/harness/architecture-foundation-harness.php"

      - name: Commit exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UPayments.php tests/harness/architecture-foundation-harness.php
          git commit -m 'fix: make order completion preference fail safe'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
