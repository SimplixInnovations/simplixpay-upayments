name: Temporary E1 architecture ownership applicator

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - '.github/workflows/_temporary-apply-e1-architecture-ownership.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact architecture and static-analysis ownership
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dcaab50db4efded0b96c9533881636a244867ff6" || true
          test "$(git hash-object tests/harness/architecture-foundation-harness.php)" = "0c8b2049ec86c0809045c6c84439dcd742302157"
          test "$(git hash-object phpstan.neon.dist)" = "a0952a4b17010001cc1457d09ea85406154ff1f6"
          test "$(git hash-object phpcs.xml.dist)" = "668c33faa4111cdf578376300671b88b39de1ff4"

          python3 <<'PY'
          from pathlib import Path

          p = Path('tests/harness/architecture-foundation-harness.php')
          s = p.read_text()
          replacements = [
              ("$settingsReadSequence = array(\n    'variable:$settings', '=', 'name:get_option', '(', 'string:woocommerce_upayments_settings', ')', ';',\n);\n",
               "$settingsReadSequence = array(\n    'variable:$settings', '=', 'name:get_option', '(', 'string:woocommerce_upayments_settings', ')', ';',\n);\n$availabilityDelegateSequence = array(\n    'return', 'name:Availability', '::', 'name:filter', '(', 'variable:$available_gateways', ')', ';',\n);\n$runtimeEligibilitySequence = array(\n    'name:GatewaySettings', '::', 'name:is_runtime_eligible', '(',\n    'variable:$settings', ',', 'name:get_woocommerce_currency', '(', ')', ')',\n);\n"),
              ("$checkoutOrchestrator = arch_read($root, 'src/Payment/CheckoutOrchestrator.php');\n$gatewayTokens = arch_executable_tokens($gateway);\n",
               "$checkoutOrchestrator = arch_read($root, 'src/Payment/CheckoutOrchestrator.php');\n$gatewayAvailability = arch_read($root, 'src/Gateway/Availability.php');\n$gatewayTokens = arch_executable_tokens($gateway);\n"),
              ("$checkoutProcess = arch_direct_public_method($checkoutOrchestratorClassTokens, 'process');\n$availabilityBinding = arch_direct_top_level_filter_callback(\n",
               "$checkoutProcess = arch_direct_public_method($checkoutOrchestratorClassTokens, 'process');\n$gatewayAvailabilityTokens = arch_executable_tokens($gatewayAvailability);\n$gatewayAvailabilityClassTokens = arch_class_body_tokens($gatewayAvailabilityTokens, 'Availability');\n$gatewayAvailabilityFilter = arch_direct_public_method($gatewayAvailabilityClassTokens, 'filter');\n$availabilityBinding = arch_direct_top_level_filter_callback(\n"),
              ("$acceptedGatewayBytes = 87724;\n",
               "// Post-T3 E1 extracts the historical available-gateways policy to\n// src/Gateway/Availability.php while retaining the global callback as a thin adapter.\n$acceptedGatewayBytes = 86992;\n"),
              ("arch_assert(is_file($root . '/src/Admin/GatewaySettings.php'), 'Admin GatewaySettings boundary exists');\n",
               "arch_assert(is_file($root . '/src/Admin/GatewaySettings.php'), 'Admin GatewaySettings boundary exists');\narch_assert(is_file($root . '/src/Gateway/Availability.php'), 'E1 Gateway Availability boundary exists');\narch_assert(arch_contains($gatewayAvailability, 'namespace Simplixi\\\\SUPCheckout\\\\Gateway;'), 'E1 Gateway Availability uses SUPCheckout Gateway namespace');\n"),
              ("arch_assert($availabilityBinding['found'], 'enableUpaymentsGateway remains a direct top-level registered availability callback');\narch_assert(\n    arch_has_token_sequence($availabilityBinding['body'], $settingsReadSequence),\n    'legacy WooCommerce settings option remains an executable direct global availability-callback read'\n);\n",
               "arch_assert($availabilityBinding['found'], 'enableUpaymentsGateway remains a direct top-level registered availability callback');\narch_assert(\n    arch_has_token_sequence($availabilityBinding['body'], $availabilityDelegateSequence),\n    'legacy global availability callback directly delegates to the E1 Gateway Availability boundary'\n);\narch_assert($gatewayAvailabilityFilter['found'], 'E1 Gateway Availability filter entry point is public and executable');\narch_assert(\n    arch_has_token_sequence($gatewayAvailabilityFilter['body'], $settingsReadSequence),\n    'legacy WooCommerce settings option remains an executable availability-policy read behind the compatibility adapter'\n);\narch_assert(\n    arch_has_token_sequence($gatewayAvailabilityFilter['body'], $runtimeEligibilitySequence),\n    'E1 Gateway Availability enforces deterministic runtime eligibility before presentation policy'\n);\narch_assert(\n    arch_contains($gatewayAvailability, \"isset($available_gateways['enable_autodeduction'])\") === false\n        && arch_contains($gatewayAvailability, \"$settings['enable_autodeduction'] === 'yes'\"),\n    'E1 Gateway Availability keeps auto-deduction policy sourced from canonical settings'\n);\narch_assert(\n    arch_contains($gatewayAvailability, \"$wc && $wc->session\")\n        && arch_contains($gatewayAvailability, \"$wc->session->get('chosen_payment_method')\"),\n    'E1 Gateway Availability guards session-dependent presentation policy before session access'\n);\n"),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit('architecture replacement marker count != 1: ' + old[:80])
              s = s.replace(old, new)
          p.write_text(s, newline='\n')

          p = Path('phpstan.neon.dist')
          s = p.read_text()
          marker = "        - tests/phpstan/blocks-availability-stubs.php\n"
          if s.count(marker) != 1:
              raise SystemExit('phpstan scan marker count != 1')
          s = s.replace(marker, marker + "        - tests/phpstan/gateway-availability-stubs.php\n")
          marker = "        - src/Admin/GatewaySettings.php\n"
          if s.count(marker) != 1:
              raise SystemExit('phpstan path marker count != 1')
          s = s.replace(marker, marker + "        - src/Gateway/Availability.php\n")
          p.write_text(s, newline='\n')

          p = Path('phpcs.xml.dist')
          s = p.read_text()
          marker = "    <file>src/Admin/GatewaySettings.php</file>\n"
          if s.count(marker) != 1:
              raise SystemExit('phpcs marker count != 1')
          s = s.replace(marker, marker + "    <file>src/Gateway/Availability.php</file>\n")
          p.write_text(s, newline='\n')
          PY

          cat > tests/phpstan/gateway-availability-stubs.php <<'PHP'
          <?php

          /** Development-only WooCommerce availability symbols for bounded PHPStan scope. */
          class SUPCheckoutPhpstanSession {
              /** @return mixed */
              public function get($key) {}
              /** @return void */
              public function set($key, $value) {}
          }

          class SUPCheckoutPhpstanWooContainer {
              /** @var SUPCheckoutPhpstanSession|null */
              public $session;
          }

          /** @return bool */
          function is_admin() {}

          /** @return bool */
          function is_checkout() {}

          /** @return SUPCheckoutPhpstanWooContainer|null */
          function WC() {}
          PHP

          php -l tests/harness/architecture-foundation-harness.php
          php -l tests/phpstan/gateway-availability-stubs.php
          php tests/harness/architecture-foundation-harness.php
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/harness/architecture-foundation-harness.php phpstan.neon.dist phpcs.xml.dist tests/phpstan/gateway-availability-stubs.php
          git diff --cached --exit-code && exit 0
          git commit -m 'test: own extracted gateway availability boundary'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
