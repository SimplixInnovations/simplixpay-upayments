name: Agent H12 Payability Double Repair

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - '.github/workflows/agent-h12-payability-double-repair.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
      - name: Require isolated staging tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=599f4e8330024ea11d59b83fcb5da2000c99c543
          ACTUAL=$(git diff --name-only "$BASE"..HEAD | sort)
          EXPECTED=.github/workflows/agent-h12-payability-double-repair.yml
          test "$ACTUAL" = "$EXPECTED"
      - name: Repair H12 Woo payability test double
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/harness/_bootstrap.php')
          s = p.read_text()
          old = """        return $total;\n    }\n    public function get_billing_email() { return $this->data['billing']['email']; }\n"""
          new = """        return $total;\n    }\n    public function needs_payment() {\n        // This synthetic H12 order intentionally has no Woo status machine.\n        // Existing H12 cases default to payable so they continue exercising\n        // their downstream payment/security contracts. A test may explicitly\n        // set order_data['needs_payment'] to false to model Woo's outer gate.\n        return array_key_exists('needs_payment', $this->data)\n            ? (bool) $this->data['needs_payment']\n            : true;\n    }\n    public function get_billing_email() { return $this->data['billing']['email']; }\n"""
          if s.count(old) != 1:
              raise SystemExit(f'expected one FakeWCOrder insertion point, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          php -l tests/harness/_bootstrap.php
          git diff --check
          test "$(git diff --name-only)" = "tests/harness/_bootstrap.php"
      - name: Re-run protected H12 PHP harness
        run: php tests/harness/phase-9g-h12-php-harness.php
      - name: Commit only permanent H12 repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-h12-payability-double-repair.yml
          git add tests/harness/_bootstrap.php
          CACHED=$(git diff --cached --name-only | sort)
          EXPECTED=$(printf '%s\n' .github/workflows/agent-h12-payability-double-repair.yml tests/harness/_bootstrap.php | sort)
          test "$CACHED" = "$EXPECTED"
          git diff --cached --check
          git config user.name 'supcheckout-h12-agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'test(h12): model Woo payability on synthetic orders'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
