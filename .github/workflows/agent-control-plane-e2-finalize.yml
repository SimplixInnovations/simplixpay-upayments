name: Agent Control Plane E2 Finalize

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - '.github/workflows/agent-control-plane-e2-finalize.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
      - name: Require certified-tree isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE=5d8d954ffb8c2e6646dadc4aa1f994b5d56c462e
          SELF=.github/workflows/agent-control-plane-e2-finalize.yml
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE"..HEAD | tr -d '\r')" = "$SELF"
      - name: Reconcile living authority and anti-staleness ratchet
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import gzip,base64;exec(gzip.decompress(base64.b64decode('')).decode())"
          git diff --check
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:2.10.3
      - name: Install locked development toolchain
        run: composer install --no-interaction --prefer-dist
      - name: Verify reconciled control plane
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer audit --locked
          vendor/bin/phpunit tests/unit/Governance/CurrentProjectStateRegressionTest.php
          composer quality
      - name: Prove deterministic package is unchanged
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          bash scripts/build-release.sh dist
          bash scripts/verify-release.sh dist/supcheckout-0.1.0.zip
          ACTUAL_SHA=$(sha256sum dist/supcheckout-0.1.0.zip | awk '{print $1}')
          test "$ACTUAL_SHA" = "470db11afb2869bc187f0e920aeae4de02e92f6c1f7ca478ef5cb2ac62151b74"
          FILES=$(zipinfo -1 dist/supcheckout-0.1.0.zip | grep -v '/$' | wc -l | tr -d ' ')
          test "$FILES" = "55"
          rm -rf dist
      - name: Commit only reconciled control files
        shell: bash
        run: |
          set -euo pipefail
          ALLOWED=$(cat <<'EOF'
.ai-architect/architecture-contract.yaml
.ai-architect/implementation-plan.md
AGENTS.md
docs/project/NEW-CHAT-HANDOFF.md
docs/project/OWNER-HANDOFF.md
docs/project/PROJECT-STATUS.md
docs/project/START-HERE.md
tests/unit/Governance/CurrentProjectStateRegressionTest.php
EOF
          )
          ACTUAL=$(git diff --name-only | sort)
          test "$ACTUAL" = "$(printf '%s\n' "$ALLOWED" | sort)"
          git diff --check
          git config user.name 'supcheckout-control-plane-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -- .ai-architect/architecture-contract.yaml .ai-architect/implementation-plan.md AGENTS.md docs/project/NEW-CHAT-HANDOFF.md docs/project/OWNER-HANDOFF.md docs/project/PROJECT-STATUS.md docs/project/START-HERE.md tests/unit/Governance/CurrentProjectStateRegressionTest.php
          git diff --cached --name-only | sort | diff -u <(printf '%s\n' "$ALLOWED" | sort) -
          git commit -m 'docs(control): advance certified gate to residual E2'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
