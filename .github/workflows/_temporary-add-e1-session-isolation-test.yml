name: Temporary E1 session-isolation test applicator

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - '.github/workflows/_temporary-add-e1-session-isolation-test.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Add RED session-isolation regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tests/integration/CheckoutRegistrationTest.php)" = "54b2b46e1d7981ebb861aa4b7b509cebc5d98ae5"
          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/integration/CheckoutRegistrationTest.php')
          s = p.read_text()
          marker = "WC()->session = $original_session;\n\nsupcheckout_cert_store_option_raw('woocommerce_upayments_settings', $original_settings);"
          insert = """WC()->session = $original_session;

// Registry inspection outside checkout must be observational. Session-backed
// callers may inspect availability from account/custom/REST-adjacent code, but
// that must not erase a customer's already chosen checkout payment method.
if (!WC()->session) {
    WC()->session = new WC_Session_Handler();
    WC()->session->init();
}
WC()->session->set('chosen_payment_method', 'upayments');
$non_checkout_gateways = array(
    'upayments' => (object) array('id' => 'upayments'),
    'cod'       => (object) array('id' => 'cod'),
);
$non_checkout_result = enableUpaymentsGateway($non_checkout_gateways);
supcheckout_cert_assert(
    isset($non_checkout_result['upayments']),
    'Non-checkout availability inspection preserves eligible UPayments'
);
supcheckout_cert_assert(
    WC()->session->get('chosen_payment_method') === 'upayments',
    'Non-checkout availability inspection does not mutate chosen payment method'
);
WC()->session = $original_session;

supcheckout_cert_store_option_raw('woocommerce_upayments_settings', $original_settings);"""
          if s.count(marker) != 1:
              raise SystemExit('session-isolation insertion marker count != 1')
          s = s.replace(marker, insert)
          p.write_text(s, newline='\n')
          PY
          php -l tests/integration/CheckoutRegistrationTest.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/CheckoutRegistrationTest.php
          git commit -m 'test: isolate availability from non-checkout session mutation'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
