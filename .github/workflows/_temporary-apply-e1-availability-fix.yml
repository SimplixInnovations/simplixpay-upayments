name: Temporary E1 availability patch applicator

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - '.github/workflows/_temporary-apply-e1-availability-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact E1 availability extraction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object UPayments.php)" = "ac22b6719cdc75efd616be5865f1cf80facb959b"
          test "$(git hash-object src/Gateway/Availability.php)" = "b1992d0fe1d6a15982d359cbe16b63ce774480ca"

          python3 <<'PY'
          from pathlib import Path

          gateway_path = Path('UPayments.php')
          gateway = gateway_path.read_text(encoding='utf-8')

          require_marker = "require_once __DIR__ . '/src/Admin/GatewaySettings.php';\n"
          if gateway.count(require_marker) != 1:
              raise SystemExit('GatewaySettings require marker count is not exactly one')
          gateway = gateway.replace(
              require_marker,
              require_marker + "require_once __DIR__ . '/src/Gateway/Availability.php';\n",
          )

          use_marker = "use Simplixi\\SUPCheckout\\Admin\\GatewaySettings;\n"
          if gateway.count(use_marker) != 1:
              raise SystemExit('GatewaySettings use marker count is not exactly one')
          gateway = gateway.replace(
              use_marker,
              use_marker + "use Simplixi\\SUPCheckout\\Gateway\\Availability;\n",
          )

          old_filter = '''function enableUpaymentsGateway($available_gateways)
          {
              if (is_admin()){
                  return $available_gateways;
              }

              if (isset($available_gateways["upayments"])){
                  // Keep UPayments last unless reordered.
                  $upay = $available_gateways['upayments'];
                  unset($available_gateways['upayments']);
                  $available_gateways['upayments'] = $upay;

                  $settings = get_option("woocommerce_upayments_settings");

                  if (is_checkout() && isset($available_gateways['cod']) && (isset($settings['enable_autodeduction']) && $settings['enable_autodeduction'] === 'yes')) {
                      unset($available_gateways['cod']);
                  }

                  if (WC()->session->get('chosen_payment_method') === 'upayments' && (isset($settings['make_default_gateway']) && $settings['make_default_gateway'] !== 'yes')) {
                      WC()->session->set('chosen_payment_method', null);
                  }
              }

              return $available_gateways;
          }'''
          new_filter = '''function enableUpaymentsGateway($available_gateways)
          {
              return Availability::filter($available_gateways);
          }'''
          if gateway.count(old_filter) != 1:
              raise SystemExit('Legacy availability filter body count is not exactly one')
          gateway = gateway.replace(old_filter, new_filter)
          gateway_path.write_text(gateway, encoding='utf-8', newline='\n')

          availability_path = Path('src/Gateway/Availability.php')
          availability = availability_path.read_text(encoding='utf-8')
          old_session = '''            if (WC()->session->get('chosen_payment_method') === 'upayments'
                          && isset($settings['make_default_gateway'])
                          && $settings['make_default_gateway'] !== 'yes'
                      ) {
                          WC()->session->set('chosen_payment_method', null);
                      }'''
          new_session = '''            $wc = function_exists('WC') ? WC() : null;
                      if ($wc && $wc->session
                          && $wc->session->get('chosen_payment_method') === 'upayments'
                          && isset($settings['make_default_gateway'])
                          && $settings['make_default_gateway'] !== 'yes'
                      ) {
                          $wc->session->set('chosen_payment_method', null);
                      }'''
          if availability.count(old_session) != 1:
              raise SystemExit('Availability session policy marker count is not exactly one')
          availability = availability.replace(old_session, new_session)
          availability_path.write_text(availability, encoding='utf-8', newline='\n')
          PY

          php -l UPayments.php
          php -l src/Gateway/Availability.php
          test "$(wc -c < UPayments.php | tr -d ' ')" = "86992"
          test "$(git hash-object UPayments.php)" = "d240d152beff5589a94cff48350ff5e8c292e215"
          test "$(git hash-object src/Gateway/Availability.php)" = "cfe3c5bac01917f57766238cff58c0cea824a887"
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UPayments.php src/Gateway/Availability.php
          git diff --cached --exit-code && exit 0
          git commit -m 'fix: extract Classic availability compatibility adapter'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
