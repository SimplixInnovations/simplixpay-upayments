name: Security Closure P1 Once

on:
  push:
    branches:
      - docs/security-threat-model-closure

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/security-threat-model-closure
          fetch-depth: 0

      - name: Reconcile live gate markers in permanent control records
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          master = 'docs/project/MASTER-ENGINEERING-PLAYBOOK.md'
          replace_once(master,
              '| Security threat-model audit | **DISCOVERY — CURRENT GATE** | Critical |\n| Architecture/code quality | **PARTIAL** | High |',
              '| Security threat-model audit | **DONE / VERIFIED** | Critical |\n| Architecture/code quality | **DISCOVERY — CURRENT GATE** | High |',
              'master roadmap rows')
          replace_once(master,
              'Provider Contract & Payment Lifecycle is **DONE / VERIFIED**. The current unified gate is **Security Threat-Model Closure — DISCOVERY**. Provider contract and lifecycle rows remain separated because they retain distinct closed contracts and regression evidence.',
              'Provider Contract & Payment Lifecycle and the bounded Security Threat-Model Closure are **DONE / VERIFIED**. The current unified gate is **Architecture & Code-Quality Foundation — DISCOVERY**. Provider contract and lifecycle rows remain separated because they retain distinct closed contracts and regression evidence.',
              'master unified gate')
          replace_once(master,
              '4. Security Threat-Model Closure — **CURRENT / DISCOVERY**.\n5. Architecture & Code Quality Foundation.',
              '4. Security Threat-Model Closure — **DONE / VERIFIED**.\n5. Architecture & Code Quality Foundation — **CURRENT / DISCOVERY**.',
              'master phase order')
          replace_once(master,
              '# SECURITY THREAT-MODEL AUDIT\n\n**Current program status:** DISCOVERY / CURRENT GATE.',
              '# SECURITY THREAT-MODEL AUDIT\n\n**Program status:** DONE / VERIFIED. This section retains the security phase scope as a historical engineering standard; the current program gate is **Architecture & Code-Quality Foundation — DISCOVERY**.',
              'master security section status')

          phase9i = 'docs/project/PHASE-9I-MIGRATION.md'
          replace_once(phase9i,
              'The program gate immediately after Phase 9I was **Provider Contract & Payment Lifecycle**; that gate is now **DONE / VERIFIED**. The current program gate is **Security Threat-Model Closure — DISCOVERY**.',
              'The program gate immediately after Phase 9I was **Provider Contract & Payment Lifecycle**; that gate and the subsequent bounded **Security Threat-Model Closure** are now **DONE / VERIFIED**. The current program gate is **Architecture & Code-Quality Foundation — DISCOVERY**.',
              'phase9i current gate')

          provider = 'docs/project/PROVIDER-PAYMENT-LIFECYCLE.md'
          replace_once(provider,
              'The next program gate is **Security Threat-Model Closure — DISCOVERY**.',
              'The program gate immediately after this closure was **Security Threat-Model Closure**; that bounded gate is now **DONE / VERIFIED**. The current program gate is **Architecture & Code-Quality Foundation — DISCOVERY**.',
              'provider opening next gate')
          replace_once(provider,
              'This closure does not mean the plugin is broadly production-certified. Security threat-model closure, architecture quality, full integration/static/browser platforms, WordPress/WooCommerce/PHP/HPOS/Blocks/WPML certification, feature certification, performance/UX/operations and release engineering remain later gates.',
              'This closure does not mean the plugin is broadly production-certified. The bounded Security Threat-Model Closure is now independently **DONE / VERIFIED**; architecture quality, full integration/static/browser platforms, WordPress/WooCommerce/PHP/HPOS/Blocks/WPML certification, feature certification, performance/UX/operations and release engineering remain later gates.',
              'provider nonclaims')
          replace_once(provider,
              'The next permitted program gate is **Security Threat-Model Closure — DISCOVERY**.',
              'The current permitted program gate is **Architecture & Code-Quality Foundation — DISCOVERY**.',
              'provider closing next gate')

          files = [master, phase9i, provider]
          forbidden = [
              re.compile(r'current(?: unified)? (?:program )?gate[^\n]{0,120}Security Threat-Model Closure', re.I),
              re.compile(r'next(?: permitted)? program gate[^\n]{0,120}Security Threat-Model Closure', re.I),
              re.compile(r'Security Threat-Model Closure[^\n]{0,80}(?:CURRENT / DISCOVERY|DISCOVERY — CURRENT GATE)', re.I),
              re.compile(r'Security threat-model audit \| \*\*DISCOVERY — CURRENT GATE', re.I),
          ]
          for path in files:
              text = Path(path).read_text(encoding='utf-8')
              for pattern in forbidden:
                  matches = pattern.findall(text)
                  if matches:
                      raise SystemExit(f'{path}: stale live gate marker remains: {matches}')

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '| Security threat-model audit | **DONE / VERIFIED** | Critical |' docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          grep -Fq '| Architecture/code quality | **DISCOVERY — CURRENT GATE** | High |' docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          grep -Fq 'The current unified gate is **Architecture & Code-Quality Foundation — DISCOVERY**.' docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          grep -Fq '5. Architecture & Code Quality Foundation — **CURRENT / DISCOVERY**.' docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          grep -Fq 'The current program gate is **Architecture & Code-Quality Foundation — DISCOVERY**.' docs/project/PHASE-9I-MIGRATION.md
          grep -Fq 'The current program gate is **Architecture & Code-Quality Foundation — DISCOVERY**.' docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
          grep -Fq 'The current permitted program gate is **Architecture & Code-Quality Foundation — DISCOVERY**.' docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project/MASTER-ENGINEERING-PLAYBOOK.md docs/project/PHASE-9I-MIGRATION.md docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
          git commit -m 'docs: reconcile stale security gate markers'
          git push origin HEAD:docs/security-threat-model-closure
