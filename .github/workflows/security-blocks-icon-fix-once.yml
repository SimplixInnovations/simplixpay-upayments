name: Security Blocks Icon Fix Once

on:
  push:
    branches:
      - security/threat-model-discovery

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/threat-model-discovery
          fetch-depth: 0

      - name: Apply exact Blocks chevron fix
        shell: python
        run: |
          from pathlib import Path
          import re

          blocks_path = Path('assets/js/upayments-block.js')
          blocks = blocks_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"createElement\('i',\s*\{\s*className: 'fa fa-chevron-right',\s*style: \{\s*marginLeft: '10px'\s*\}\s*\}\)",
              re.MULTILINE,
          )
          replacement = """createElement('span', {
                                            className: 'upay-chevron',
                                            'aria-hidden': 'true',
                                            style: {
                                                marginLeft: '10px',
                                                fontSize: '20px',
                                                lineHeight: '1'
                                            }
                                        }, '›')"""
          blocks, count = pattern.subn(replacement, blocks)
          if count != 3:
              raise SystemExit(f'Blocks Font Awesome chevron contract changed: {count}')
          if 'fa fa-chevron-right' in blocks:
              raise SystemExit('Font Awesome chevron remains in Blocks renderer')
          blocks_path.write_text(blocks, encoding='utf-8')

          harness_path = Path('tests/harness/security-threat-model-harness.php')
          harness = harness_path.read_text(encoding='utf-8')
          old = "$old_template = sec_source('templates/old-design-form.php');\n$workflow = sec_source('.github/workflows/quality-gates.yml');"
          new = "$old_template = sec_source('templates/old-design-form.php');\n$blocks_js = sec_source('assets/js/upayments-block.js');\n$workflow = sec_source('.github/workflows/quality-gates.yml');"
          if harness.count(old) != 1:
              raise SystemExit(f'Blocks harness source insertion contract changed: {harness.count(old)}')
          harness = harness.replace(old, new, 1)

          old = "sec_assert(strpos($new_template, 'upay-chevron') !== false, 'new checkout template uses local text/CSS chevron');"
          new = old + "\nsec_assert(strpos($blocks_js, 'fa fa-chevron-right') === false, 'Blocks checkout renderer does not depend on Font Awesome chevron');\nsec_assert(substr_count($blocks_js, \"className: 'upay-chevron'\") >= 3, 'Blocks checkout renderer uses local chevrons for all payment rows');"
          if harness.count(old) != 1:
              raise SystemExit(f'Blocks harness assertion contract changed: {harness.count(old)}')
          harness = harness.replace(old, new, 1)
          harness_path.write_text(harness, encoding='utf-8')

          doc_path = Path('docs/project/SECURITY-THREAT-MODEL.md')
          doc = doc_path.read_text(encoding='utf-8')
          old = '- replace Font Awesome chevrons with local text/CSS presentation;'
          new = '- replace Font Awesome chevrons in both classic and Blocks renderers with local text/CSS presentation;'
          if doc.count(old) != 1:
              raise SystemExit(f'SEC-03 closure contract changed: {doc.count(old)}')
          doc_path.write_text(doc.replace(old, new, 1), encoding='utf-8')

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check assets/js/upayments-block.js
          php -l tests/harness/security-threat-model-harness.php
          php tests/harness/security-threat-model-harness.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/upayments-block.js tests/harness/security-threat-model-harness.php docs/project/SECURITY-THREAT-MODEL.md
          git diff --cached --quiet && exit 0
          git commit -m 'security: remove Blocks Font Awesome chevron dependency'
          git push origin HEAD:security/threat-model-discovery