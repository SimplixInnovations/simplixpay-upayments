name: Compatibility Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-runtime:
    name: WP 7.1 / WC 11.1.0 / PHP 8.3 activation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: curl, mbstring, mysqli, zip
          coverage: none

      - name: Install pinned WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL             https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar             -o /tmp/wp-cli.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum -c -
          chmod +x /tmp/wp-cli.phar
          /tmp/wp-cli.phar --version

      - name: Install real WordPress and WooCommerce runtime
        env:
          WP_CLI_BIN: /tmp/wp-cli.phar
        run: bash scripts/install-wp-test-environment.sh 7.1 11.1.0 "$RUNNER_TEMP/wordpress"

      - name: Seed malformed protected settings
        env:
          SIMPLIXPAY_CERT_PHASE: seed
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/PluginActivationTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Activate SimplixPay
        run: /tmp/wp-cli.phar plugin activate simplixpay-upayments --path="$RUNNER_TEMP/wordpress"

      - name: Verify activation and Classic registration
        env:
          SIMPLIXPAY_CERT_PHASE: verify
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/PluginActivationTest.php" --path="$RUNNER_TEMP/wordpress"
