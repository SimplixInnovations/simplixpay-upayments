name: Agent E2 Tax Item Reconcile

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - '.github/workflows/agent-e2-tax-item-reconcile.yml'

permissions:
  contents: write
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Replace synthetic line-tax evidence with persisted Woo tax item
        shell: bash
        env:
          EXPECTED_PARENT: 69c5a64c393a58ecd8188d9df37619aafbc5f61e
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/integration/OrderEconomicsRuntimeTest.php')
          text = path.read_text()
          old = """// Tax-bearing persisted line: E2 certifies the finalized Woo order contract rather
          // than reconstructing Woo's tax engine without a real tax-rate object. Persisted line
          // tax evidence plus the finalized order total model the state the gateway actually reads.
          $taxed = supcheckout_e2_product('E2 Taxed Product', '10.000');
          $order = supcheckout_e2_order(array(array($taxed, 1)));
          $line_items = $order->get_items('line_item');
          $line = reset($line_items);
          supcheckout_cert_assert($line instanceof WC_Order_Item_Product, 'tax fixture has a real Woo line item');
          $line->set_subtotal_tax('0.500');
          $line->set_total_tax('0.500');
          $line->save();
          $order->set_total('10.500');
          $order->save();
          $order = wc_get_order($order->get_id());
          supcheckout_cert_assert($order instanceof WC_Order, 'tax fixture reloads through Woo CRUD');
          supcheckout_cert_assert(10.5 === (float) $order->get_total(), 'tax fixture persists finalized Woo total including tax delta');
          $reloaded_lines = $order->get_items('line_item');
          $reloaded_line = reset($reloaded_lines);
          supcheckout_cert_assert($reloaded_line instanceof WC_Order_Item_Product && 0.5 === (float) $reloaded_line->get_total_tax(), 'tax fixture persists line tax evidence');
          $calls = array();
          supcheckout_e2_run($order, $calls);
          $payload = supcheckout_e2_assert_charge($order, $calls, 'tax-bearing order');
          supcheckout_cert_assert(isset($payload['products']) && 1 === count($payload['products']), 'tax-bearing order: product descriptor remains descriptive');
          supcheckout_e2_delete_order_and_products($order, array($taxed));
          """
          new = """// Tax-bearing persisted order: E2 certifies the actual state the gateway reads.
          // A Woo tax item records the tax component while the finalized order total remains
          // authoritative; products[] continues to describe only the product line.
          $taxed = supcheckout_e2_product('E2 Taxed Product', '10.000');
          $order = supcheckout_e2_order(array(array($taxed, 1)));
          $tax_item = new WC_Order_Item_Tax();
          $tax_item->set_rate_id(0);
          $tax_item->set_label('E2 Certification Tax');
          $tax_item->set_tax_total('0.500');
          $tax_item->set_shipping_tax_total('0');
          $order->add_item($tax_item);
          $order->set_total('10.500');
          $order->save();
          $order = wc_get_order($order->get_id());
          supcheckout_cert_assert($order instanceof WC_Order, 'tax fixture reloads through Woo CRUD');
          supcheckout_cert_assert(10.5 === (float) $order->get_total(), 'tax fixture persists finalized Woo total including tax delta');
          $tax_items = $order->get_items('tax');
          $reloaded_tax = reset($tax_items);
          supcheckout_cert_assert($reloaded_tax instanceof WC_Order_Item_Tax && 0.5 === (float) $reloaded_tax->get_tax_total(), 'tax fixture persists real Woo tax-item evidence');
          $calls = array();
          supcheckout_e2_run($order, $calls);
          $payload = supcheckout_e2_assert_charge($order, $calls, 'tax-bearing order');
          supcheckout_cert_assert(isset($payload['products']) && 1 === count($payload['products']), 'tax-bearing order: product descriptor remains descriptive');
          supcheckout_e2_delete_order_and_products($order, array($taxed));
          """
          if text.count(old) != 1:
              raise SystemExit('expected tax fixture block not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          php -l tests/integration/OrderEconomicsRuntimeTest.php

      - name: Commit surgical correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Simplix Innovations Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/agent-e2-tax-item-reconcile.yml
          git add tests/integration/OrderEconomicsRuntimeTest.php
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/agent-e2-tax-item-reconcile.yml tests/integration/OrderEconomicsRuntimeTest.php "
          git commit -m 'test(e2): model tax with persisted Woo tax item'
          git push origin HEAD:audit/post-t3-ecosystem-hardening

      - name: Dispatch exact-head qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in quality-gates.yml compatibility-certification.yml provider-sandbox-certification.yml release-artifact.yml wordpress-org-submission-check.yml; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" -f ref='audit/post-t3-ecosystem-hardening'
          done
