name: Security Closure Polish Once

on:
  push:
    branches:
      - docs/security-threat-model-closure

permissions:
  contents: write

jobs:
  polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/security-threat-model-closure
          fetch-depth: 0

      - name: Correct final stale continuity wording
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'docs/project/MASTER-ENGINEERING-PLAYBOOK.md': (
                  'The provider lifecycle implementation anchor above is post-merge verified.',
                  'The security implementation anchor above is post-merge verified.'
              ),
              'docs/project/REPOSITORY-AUDIT.md': (
                  'These are explicit later/security inputs, not hidden implementation gaps that may be guessed through cleanup.',
                  'These remain explicit later-gate inputs, not hidden implementation gaps that may be guessed through cleanup.'
              ),
          }

          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one stale anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'The security implementation anchor above is post-merge verified.' docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          grep -Fq 'These remain explicit later-gate inputs' docs/project/REPOSITORY-AUDIT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project/MASTER-ENGINEERING-PLAYBOOK.md docs/project/REPOSITORY-AUDIT.md
          git commit -m 'docs: polish final security closure continuity'
          git push origin HEAD:docs/security-threat-model-closure
