name: Agent E2 Core Adjustments

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - '.github/workflows/agent-e2-core-adjustments.yml'

permissions:
  contents: write

env:
  SUPCHECKOUT_PLUGIN_SLUG: supcheckout

jobs:
  focused-e2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
      - name: Require isolated staging tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=a3103541fb7ddec15711bda2df8089baf5baa243
          ACTUAL=$(git diff --name-only "$BASE"..HEAD | sort)
          EXPECTED=$(printf '%s\n' .github/agent-e2-core-adjustments.py .github/workflows/agent-e2-core-adjustments.yml | sort)
          test "$ACTUAL" = "$EXPECTED"
      - name: Apply guarded E2 test expansion
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/agent-e2-core-adjustments.py
          php -l tests/integration/OrderEconomicsRuntimeTest.php
          git rm .github/agent-e2-core-adjustments.py
          git diff --check
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: curl, mbstring, mysqli, zip
          coverage: none
          tools: none
      - name: Install pinned WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum -c -
          chmod +x /tmp/wp-cli.phar
      - name: Install real WordPress and WooCommerce runtime
        env:
          WP_CLI_BIN: /tmp/wp-cli.phar
        run: bash scripts/install-wp-test-environment.sh '7.1' '11.1.0' "$RUNNER_TEMP/wordpress"
      - name: Activate SUPCheckout
        run: /tmp/wp-cli.phar plugin activate "$SUPCHECKOUT_PLUGIN_SLUG" --path="$RUNNER_TEMP/wordpress"
      - name: Run focused E2 runtime
        run: /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OrderEconomicsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"
      - name: Commit only E2 test plus helper cleanup
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(printf '%s\n' .github/agent-e2-core-adjustments.py tests/integration/OrderEconomicsRuntimeTest.php | sort)
          git diff --check
          git config user.name 'supcheckout-e2-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/integration/OrderEconomicsRuntimeTest.php
          CACHED=$(git diff --cached --name-only | sort)
          test "$CACHED" = "$EXPECTED"
          test -z "$(git diff --name-only)"
          git commit -m 'test(e2): qualify core coupons and persisted adjustments'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
