name: Agent Control Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/agent-control-reconcile.py'
      - '.github/workflows/agent-control-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Skip after helper cleanup
        id: helper
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/agent-control-reconcile.py ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Reconciliation helper already removed; nothing to do.'
          fi

      - name: Set up PHP 8.5
        if: steps.helper.outputs.present == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:2.10.3

      - name: Prepare reconciled control plane
        if: steps.helper.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/agent-control-reconcile.py
          git diff --check

      - name: Install locked development toolchain
        if: steps.helper.outputs.present == 'true'
        shell: bash
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify anti-staleness regression
        if: steps.helper.outputs.present == 'true'
        shell: bash
        run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/unit/Governance/CurrentProjectStateRegressionTest.php

      - name: Verify complete quality stack
        if: steps.helper.outputs.present == 'true'
        shell: bash
        run: composer quality

      - name: Commit only durable control-plane files
        if: steps.helper.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/agent-control-reconcile.py
          git add -- \
            AGENTS.md \
            docs/project/START-HERE.md \
            docs/project/PROJECT-STATUS.md \
            docs/project/OWNER-HANDOFF.md \
            docs/project/NEW-CHAT-HANDOFF.md \
            .ai-architect/implementation-plan.md \
            .ai-architect/architecture-contract.yaml \
            tests/unit/Governance/CurrentProjectStateRegressionTest.php \
            .github/agent-control-reconcile.py

          expected="$(printf '%s\n' \
            .ai-architect/architecture-contract.yaml \
            .ai-architect/implementation-plan.md \
            .github/agent-control-reconcile.py \
            AGENTS.md \
            docs/project/NEW-CHAT-HANDOFF.md \
            docs/project/OWNER-HANDOFF.md \
            docs/project/PROJECT-STATUS.md \
            docs/project/START-HERE.md \
            tests/unit/Governance/CurrentProjectStateRegressionTest.php | sort)"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(control): promote certified E2 closure to E3'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
