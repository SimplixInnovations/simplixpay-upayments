name: Agent Control Plane E2 Reconcile

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - '.github/workflows/agent-control-plane-e2-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
      - name: Require exact certified parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5d8d954ffb8c2e6646dadc4aa1f994b5d56c462e"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/agent-control-plane-e2-reconcile.yml"
      - name: Reconcile living authority and anti-staleness ratchet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          OLD_SHA = 'b06976ac689cfd0d469bd96b0d6a2b925c863747'
          NEW_SHA = '5d8d954ffb8c2e6646dadc4aa1f994b5d56c462e'
          OLD_HASH = 'a343a028e42f17a8d111de4e1a271c4e4bd51ba8cbbc1f0de89652b0d2480455'
          NEW_HASH = '470db11afb2869bc187f0e920aeae4de02e92f6c1f7ca478ef5cb2ac62151b74'

          def rw(path, fn):
              p = Path(path)
              s = p.read_text()
              n = fn(s)
              if n == s:
                  raise SystemExit(f'no change produced for {path}')
              p.write_text(n)

          # Machine-enforced current-state ratchet.
          def patch_guard(s):
              s = s.replace("private const POST_T3_CERTIFIED_RUNTIME_SHA = '" + OLD_SHA + "';",
                            "private const POST_T3_CERTIFIED_RUNTIME_SHA = '" + NEW_SHA + "';")
              s = s.replace("private const POST_T3_CERTIFIED_PACKAGE_SHA256 = '" + OLD_HASH + "';",
                            "private const POST_T3_CERTIFIED_PACKAGE_SHA256 = '" + NEW_HASH + "';")
              s = s.replace("Its deterministic package is 53 files / SHA-256 `", "Its deterministic package is 55 files / SHA-256 `")
              s = s.replace("- deterministic installable package — **53 files**, SHA-256 `", "- deterministic installable package — **55 files**, SHA-256 `")
              s = s.replace("its deterministic 53-file candidate package SHA-256 is `", "its deterministic 55-file candidate package SHA-256 is `")
              s = s.replace("- deterministic package — 53 files / SHA-256 `", "- deterministic package — 55 files / SHA-256 `")
              marker = "    public function test_architecture_contract_records_t3_and_rejects_the_obsolete_t2_next_candidate(): void {"
              method = r'''    public function test_current_post_t3_gate_cannot_regress_before_residual_e2(): void {
        $start = self::read_repository_file('docs/project/START-HERE.md');
        $status = self::read_repository_file('docs/project/PROJECT-STATUS.md');
        $handoff = self::read_repository_file('docs/project/NEW-CHAT-HANDOFF.md');
        $implementation = self::read_repository_file('.ai-architect/implementation-plan.md');
        $contract = self::read_repository_file('.ai-architect/architecture-contract.yaml');

        self::assertStringContainsString('Current operational gate | **E2 residual ecosystem economics / extension-generated contracts**', $start);
        self::assertStringContainsString('R0 / R1 / E1 | **DONE / VERIFIED on PR #108 branch**', $start);
        self::assertStringContainsString('E2 generic/core | **CERTIFIED**', $start);
        self::assertStringContainsString('Current executable gate: **E2 residual ecosystem economics / extension-generated contracts**.', $status);
        self::assertStringContainsString('Current executable gate: **E2 residual ecosystem economics / extension-generated contracts**.', $handoff);
        self::assertStringContainsString('Generic/core E2 exact-head checkpoint: `' . self::POST_T3_CERTIFIED_RUNTIME_SHA . '`', $implementation);
        self::assertStringContainsString('latest_certified_runtime_checkpoint: ' . self::POST_T3_CERTIFIED_RUNTIME_SHA, $contract);
        self::assertStringContainsString('current_gate: e2-residual-ecosystem-economics', $contract);
        self::assertStringNotContainsString('R0 control-plane reconciliation, then remaining R1', $start);
        self::assertStringNotContainsString('Finish/certify **R0**', $handoff);
    }

'''
              if method.strip() not in s:
                  if marker not in s:
                      raise SystemExit('guard insertion marker missing')
                  s = s.replace(marker, method + marker, 1)
              return s
          rw('tests/unit/Governance/CurrentProjectStateRegressionTest.php', patch_guard)

          def patch_agents(s):
              old = f"The latest fully certified runtime-content checkpoint inside PR #108 before R0 control-plane reconciliation is `{OLD_SHA}`. Quality, all 20 Compatibility cells plus Compatibility Gate, Provider Sandbox, WordPress.org Submission Check, Release Artifact and CodeQL succeeded at that exact head. Its deterministic package is 53 files / SHA-256 `{OLD_HASH}`."
              new = f"The latest fully certified generic/core E2 checkpoint inside PR #108 is `{NEW_SHA}`. Quality/H12, all 20 Compatibility cells plus Compatibility Gate, Provider Sandbox, WordPress.org Submission Check, Release Artifact and CodeQL succeeded at that exact head. Its deterministic package is 55 files / SHA-256 `{NEW_HASH}`."
              if old not in s: raise SystemExit('AGENTS checkpoint block missing')
              s = s.replace(old, new, 1)
              old2 = "Current post-T3 execution order: R0 control-plane reconciliation; R1 bounded correctness; E1 interactive checkout compatibility; E2 economics/product compatibility; E3 theme/cache/analytics evidence; R2 callback portability/cache safety; R3 subscription safety; R4 scalability/idempotency/observability; separately gated R5/T4 architecture decision; R6 final exact-head qualification and owner re-acceptance."
              new2 = "Current post-T3 state: R0, R1 and E1 are DONE / VERIFIED on the PR #108 branch; generic/core E2 is CERTIFIED at the exact checkpoint above. The current executable gate is residual E2 ecosystem economics / extension-generated contracts, followed by E3 theme/cache/analytics evidence, R2 callback portability/cache safety, R3 subscription safety, R4 scalability/idempotency/observability, separately gated R5/T4 architecture decision, and R6 final exact-head qualification plus owner re-acceptance."
              if old2 not in s: raise SystemExit('AGENTS execution block missing')
              return s.replace(old2, new2, 1)
          rw('AGENTS.md', patch_agents)

          def patch_start(s):
              old = f"The latest fully certified runtime-content checkpoint inside that PR before R0 control-plane reconciliation is:\n\n`{OLD_SHA}`\n\nAt that exact SHA, Quality Gates, the full 20-cell Compatibility matrix + Compatibility Gate, Provider Sandbox Certification, WordPress.org Submission Check, Release Artifact and CodeQL all succeeded. Its deterministic package is 53 files / SHA-256 `{OLD_HASH}`."
              new = f"The latest fully certified generic/core E2 checkpoint inside that PR is:\n\n`{NEW_SHA}`\n\nAt that exact SHA, Quality/H12, the full 20-cell Compatibility matrix + Compatibility Gate, Provider Sandbox Certification, WordPress.org Submission Check, Release Artifact and CodeQL all succeeded. Its deterministic package is 55 files / SHA-256 `{NEW_HASH}`."
              if old not in s: raise SystemExit('START checkpoint block missing')
              s = s.replace(old, new, 1)
              s = s.replace(f"| Latest fully certified runtime-content PR checkpoint | `{OLD_SHA}` |", f"| Latest fully certified runtime-content PR checkpoint | `{NEW_SHA}` |", 1)
              s = s.replace(f"| Latest candidate package at that checkpoint | 53 files / SHA-256 `{OLD_HASH}` |", f"| Latest candidate package at that checkpoint | 55 files / SHA-256 `{NEW_HASH}` |", 1)
              s = s.replace("| Current operational gate | **R0 control-plane reconciliation, then remaining R1** |", "| R0 / R1 / E1 | **DONE / VERIFIED on PR #108 branch** |\n| E2 generic/core | **CERTIFIED** at `" + NEW_SHA + "` |\n| Current operational gate | **E2 residual ecosystem economics / extension-generated contracts** |", 1)
              return s
          rw('docs/project/START-HERE.md', patch_start)

          def patch_status(s):
              s = s.replace('**Last reconciled:** 2026-09-10', '**Last reconciled:** 2026-09-11', 1)
              s = s.replace(f"| Latest fully certified runtime-content PR checkpoint | **`{OLD_SHA}`** |", f"| Latest fully certified runtime-content PR checkpoint | **`{NEW_SHA}`** |", 1)
              old = f"Latest fully certified runtime-content checkpoint before R0 control-plane reconciliation:\n\n`{OLD_SHA}`\n\nAt that exact SHA:\n\n- Quality Gates — **SUCCESS**;\n- Compatibility Certification — **20/20 runtime cells + Compatibility Gate SUCCESS**;\n- Provider Sandbox Certification — **SUCCESS**;\n- WordPress.org Submission Check — **SUCCESS**;\n- Release Artifact — **SUCCESS**;\n- CodeQL — **SUCCESS**;\n- deterministic installable package — **53 files**, SHA-256 `{OLD_HASH}`."
              new = f"Latest fully certified generic/core E2 checkpoint:\n\n`{NEW_SHA}`\n\nAt that exact SHA:\n\n- Quality Gates / H12 — **SUCCESS**;\n- Compatibility Certification — **20/20 runtime cells + Compatibility Gate SUCCESS**;\n- Provider Sandbox Certification — **SUCCESS**;\n- WordPress.org Submission Check — **SUCCESS**;\n- Release Artifact — **SUCCESS**;\n- CodeQL — **SUCCESS**;\n- deterministic installable package — **55 files**, SHA-256 `{NEW_HASH}`."
              if old not in s: raise SystemExit('STATUS checkpoint block missing')
              s = s.replace(old, new, 1)
              s = s.replace("The 53-file count above was independently re-read from the exact b069 installable ZIP during R0 reconciliation. The package SHA-256 is unchanged; the earlier living-document statement of 51 files for this specific b069 package was stale documentation, not a package mutation.\n\nThat checkpoint contains bounded post-T3 correctness work plus the accessibility markup slice.", "The earlier `b06976ac689cfd0d469bd96b0d6a2b925c863747` accessibility checkpoint remains historical evidence inside this certified descendant; its 53-file artifact statement is not the current package coordinate.\n\nThat earlier checkpoint contains bounded post-T3 correctness work plus the accessibility markup slice.", 1)
              start = s.index('## Remaining post-T3 program')
              end = s.index('## Permanent payment/security invariants')
              replacement = '''## Remaining post-T3 program

R0, R1 and E1 are **DONE / VERIFIED on the PR #108 branch**. Generic/core E2 is **CERTIFIED** at the exact checkpoint above. The overall post-T3 program remains open.

Current executable gate: **E2 residual ecosystem economics / extension-generated contracts**.

1. **E2 residual:** real Woo coupon variants; payable fully-discounted product lines with shipping/tax; add-on/options and parent/child composition shells; gift-card/store-credit partial redemption; deposits/initial partial payment; shipping/tax/VAT recalculation variants; real persisted high-precision economics; post-dispatch economic mutation; partial-refund semantics; explicit fee-only/non-product-line policy. Paid/licensed named extensions remain external until legally available.
2. **E3 — theme/cache/analytics compatibility:** behavioral qualification across available Classic/block themes, optimizer/cache/CDN behavior, fragment/defer/delay interactions and analytics return/replay semantics. Paid themes/plugins remain external where packages are unavailable.
3. **R2 — callback portability/cache safety:** Woo API URL abstraction, `home_url` vs `site_url`, subdirectories, permalink/index/proxy behavior, no-cache callback/public-status semantics and replay freshness.
4. **R3 — subscription safety:** exact auto-deduct amount/currency/parent/cycle/provider binding, removal of first-card fallback, paid-parent discovery beyond `completed`, customer control policy, token-retention contract and held-cycle reconciliation.
5. **R4 — scalability/operations:** due-work scheduling/Action Scheduler, bounded batches, durable idempotency/journal semantics, observability, load/concurrency/failure injection and queue health.
6. **R5 / T4 — callback consolidation decision:** **separately gated architecture decision**. T3 characterization is evidence, not implementation authorization.
7. **R6 — final release qualification:** exact-head full gates, browser/device/manual/external qualification, fresh owner re-acceptance, explicit version/publication decision.

'''
              s = s[:start] + replacement + s[end:]
              return s
          rw('docs/project/PROJECT-STATUS.md', patch_status)

          def patch_handoff(s):
              old = f"`{OLD_SHA}`\n\nAt that exact SHA:\n\n- Quality Gates — **SUCCESS**;\n- Compatibility Certification — **20/20 runtime cells + Compatibility Gate SUCCESS**;\n- Provider Sandbox Certification — **SUCCESS**;\n- WordPress.org Submission Check — **SUCCESS**;\n- Release Artifact — **SUCCESS**;\n- CodeQL — **SUCCESS**;\n- deterministic package — 53 files / SHA-256 `{OLD_HASH}`."
              new = f"`{NEW_SHA}`\n\nAt that exact SHA:\n\n- Quality Gates / H12 — **SUCCESS**;\n- Compatibility Certification — **20/20 runtime cells + Compatibility Gate SUCCESS**;\n- Provider Sandbox Certification — **SUCCESS**;\n- WordPress.org Submission Check — **SUCCESS**;\n- Release Artifact — **SUCCESS**;\n- CodeQL — **SUCCESS**;\n- deterministic package — 55 files / SHA-256 `{NEW_HASH}`."
              if old not in s: raise SystemExit('HANDOFF checkpoint block missing')
              s = s.replace(old, new, 1)
              s = s.replace("The 53-file count was independently re-read from the exact b069 installable ZIP during R0 reconciliation; the package SHA-256 remained unchanged.\n\nAccessibility TDD evidence at that checkpoint:", "The earlier b069 accessibility checkpoint remains retained historical evidence inside this certified descendant.\n\nAccessibility TDD evidence at that earlier checkpoint:", 1)
              start = s.index('## Remaining execution order')
              end = s.index('## Permanent invariants')
              replacement = '''## Remaining execution order

R0, R1 and E1 are **DONE / VERIFIED on PR #108 branch**. Generic/core E2 is **CERTIFIED** at `''' + NEW_SHA + '''`.

Current executable gate: **E2 residual ecosystem economics / extension-generated contracts**.

1. Finish residual **E2** generic/runtime contracts and explicitly classify paid/licensed provider/product-extension cases that cannot run legally in repository CI.
2. Execute **E3** theme/cache/analytics interaction evidence.
3. Execute **R2** callback URL portability/no-cache safety.
4. Execute **R3** subscription safety: exact cycle economics/identity, selected-card authority, no first-card fallback, parent discovery, cancellation/control and held-cycle reconciliation.
5. Execute **R4** due-work scheduling, idempotency/journal, observability, load/concurrency and failure-injection hardening.
6. Gate **R5/T4** architecture separately; do not implement merely because characterization exists.
7. Execute **R6** exact-head release qualification, fresh owner re-acceptance and version decision; publication requires separate explicit authorization.

'''
              return s[:start] + replacement + s[end:]
          rw('docs/project/NEW-CHAT-HANDOFF.md', patch_handoff)

          def patch_owner(s):
              old = f"The current successor is `post-t3-ecosystem-hardening`, recorded in `docs/superpowers/plans/2026-09-10-post-t3-ecosystem-hardening.md`, with active draft PR #108. Its latest fully certified runtime-content checkpoint before R0 reconciliation is `{OLD_SHA}`; all primary workflows, the 20-cell Compatibility Gate and CodeQL succeeded, and its deterministic 53-file candidate package SHA-256 is `{OLD_HASH}`."
              new = f"The current successor is `post-t3-ecosystem-hardening`, recorded in `docs/superpowers/plans/2026-09-10-post-t3-ecosystem-hardening.md`, with active draft PR #108. Its latest fully certified generic/core E2 checkpoint is `{NEW_SHA}`; Quality/H12, all 20 Compatibility cells plus Compatibility Gate, Provider Sandbox, WordPress.org Submission Check, Release Artifact and CodeQL succeeded, and its deterministic 55-file candidate package SHA-256 is `{NEW_HASH}`. R0, R1 and E1 are complete on the PR branch; residual E2 remains the current executable gate."
              if old not in s: raise SystemExit('OWNER current successor block missing')
              return s.replace(old, new, 1)
          rw('docs/project/OWNER-HANDOFF.md', patch_owner)

          def patch_impl(s):
              old = f"The latest fully certified runtime-content checkpoint before R0 reconciliation is `{OLD_SHA}`. At that exact head, the five primary workflows, all 20 Compatibility cells + Compatibility Gate and CodeQL were successful; deterministic candidate package: 51 files / SHA-256 `{OLD_HASH}`."
              new = f"Generic/core E2 exact-head checkpoint: `{NEW_SHA}`. At that exact head, Quality/H12, all 20 Compatibility cells + Compatibility Gate, Provider Sandbox, WordPress.org Submission Check, Release Artifact and CodeQL were successful; deterministic candidate package: 55 files / SHA-256 `{NEW_HASH}`. R0, R1 and E1 are complete on the PR branch. Residual E2 ecosystem economics / extension-generated contracts are the current executable gate."
              if old not in s: raise SystemExit('implementation current checkpoint block missing')
              return s.replace(old, new, 1)
          rw('.ai-architect/implementation-plan.md', patch_impl)

          def patch_contract(s):
              s = s.replace('    latest_certified_runtime_checkpoint: ' + OLD_SHA, '    latest_certified_runtime_checkpoint: ' + NEW_SHA, 1)
              s = s.replace('    latest_certified_package_sha256: ' + OLD_HASH, '    latest_certified_package_sha256: ' + NEW_HASH, 1)
              needle = '    latest_certified_package_sha256: ' + NEW_HASH + '\n'
              if needle not in s: raise SystemExit('contract hash replacement missing')
              s = s.replace(needle, needle + '    latest_certified_package_files: 55\n    completed_on_pr_branch: [r0, r1, e1, e2-generic-core]\n    current_gate: e2-residual-ecosystem-economics\n', 1)
              return s
          rw('.ai-architect/architecture-contract.yaml', patch_contract)

          allowed = {
              'AGENTS.md',
              'docs/project/START-HERE.md',
              'docs/project/PROJECT-STATUS.md',
              'docs/project/OWNER-HANDOFF.md',
              'docs/project/NEW-CHAT-HANDOFF.md',
              '.ai-architect/implementation-plan.md',
              '.ai-architect/architecture-contract.yaml',
              'tests/unit/Governance/CurrentProjectStateRegressionTest.php',
          }
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected changed paths: {sorted(changed)}')
          PY
          git diff --check
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install locked development toolchain
        run: composer install --no-interaction --prefer-dist
      - name: Verify anti-staleness and full quality
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpunit tests/unit/Governance/CurrentProjectStateRegressionTest.php
          composer quality
      - name: Verify runtime package is unchanged by control-plane reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-control-plane-e2-reconcile.yml
          rm -rf /tmp/supcheckout-control-plane-release
          bash scripts/build-release.sh /tmp/supcheckout-control-plane-release
          ZIP="$(find /tmp/supcheckout-control-plane-release -maxdepth 1 -type f -name 'supcheckout-*.zip' -print -quit)"
          test -n "$ZIP"
          bash scripts/verify-release.sh "$ZIP"
          echo '470db11afb2869bc187f0e920aeae4de02e92f6c1f7ca478ef5cb2ac62151b74  '"$ZIP" | sha256sum -c -
          test "$(unzip -Z1 "$ZIP" | grep -v '/$' | wc -l | tr -d ' ')" = "55"
          git diff --check
      - name: Commit reconciled final tree
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.ai-architect/architecture-contract.yaml' '.ai-architect/implementation-plan.md' '.github/workflows/agent-control-plane-e2-reconcile.yml' 'AGENTS.md' 'docs/project/NEW-CHAT-HANDOFF.md' 'docs/project/OWNER-HANDOFF.md' 'docs/project/PROJECT-STATUS.md' 'docs/project/START-HERE.md' 'tests/unit/Governance/CurrentProjectStateRegressionTest.php' | sort)"
          test "$changed" = "$expected"
          git config user.name 'Simplix Innovations Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'docs(control): advance living state through certified E2 core'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
