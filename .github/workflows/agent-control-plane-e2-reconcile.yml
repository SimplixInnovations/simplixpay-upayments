name: Agent Control Plane E2 Reconcile

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - '.github/workflows/agent-control-plane-e2-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
      - name: Require certified-tree isolation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5d8d954ffb8c2e6646dadc4aa1f994b5d56c462e HEAD
          test "$(git diff --name-only 5d8d954ffb8c2e6646dadc4aa1f994b5d56c462e..HEAD)" = ".github/workflows/agent-control-plane-e2-reconcile.yml"
      - name: Reconcile living authority and anti-staleness ratchet
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import gzip,base64;exec(gzip.decompress(base64.b64decode('')).decode())"
          git diff --check
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install locked development toolchain
        run: composer install --no-interaction --prefer-dist
      - name: Verify synchronized control plane
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpunit tests/unit/Governance/CurrentProjectStateRegressionTest.php
          composer quality
      - name: Verify runtime tree and package remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only | grep -Ev '^(AGENTS\.md|docs/project/(START-HERE|PROJECT-STATUS|OWNER-HANDOFF|NEW-CHAT-HANDOFF)\.md|\.ai-architect/(implementation-plan\.md|architecture-contract\.yaml)|tests/unit/Governance/CurrentProjectStateRegressionTest\.php)$' || true)"
          rm .github/workflows/agent-control-plane-e2-reconcile.yml
          rm -rf /tmp/supcheckout-control-plane-release
          bash scripts/build-release.sh /tmp/supcheckout-control-plane-release
          ZIP="$(find /tmp/supcheckout-control-plane-release -maxdepth 1 -type f -name 'supcheckout-*.zip' -print -quit)"
          test -n "$ZIP"
          bash scripts/verify-release.sh "$ZIP"
          echo "470db11afb2869bc187f0e920aeae4de02e92f6c1f7ca478ef5cb2ac62151b74  $ZIP" | sha256sum -c -
          test "$(unzip -Z1 "$ZIP" | grep -v '/$' | wc -l | tr -d ' ')" = "55"
          git diff --check
      - name: Commit reconciled final tree
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.ai-architect/architecture-contract.yaml' '.ai-architect/implementation-plan.md' '.github/workflows/agent-control-plane-e2-reconcile.yml' 'AGENTS.md' 'docs/project/NEW-CHAT-HANDOFF.md' 'docs/project/OWNER-HANDOFF.md' 'docs/project/PROJECT-STATUS.md' 'docs/project/START-HERE.md' 'tests/unit/Governance/CurrentProjectStateRegressionTest.php' | sort)"
          test "$changed" = "$expected"
          git config user.name 'Simplix Innovations Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'docs(control): advance living state through certified E2 core'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
