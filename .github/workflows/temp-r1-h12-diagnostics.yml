name: Temporary R1 H12 diagnostics

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Identify failing permanent harness owners
        shell: bash
        run: |
          set -euo pipefail
          harnesses=(
            tests/harness/architecture-foundation-harness.php
            tests/harness/architecture-bootstrap-path-harness.php
            tests/harness/architecture-checkout-orchestration-harness.php
            tests/harness/architecture-dependency-boundaries-harness.php
            tests/harness/quality-platform-gateway-settings-harness.php
            tests/harness/quality-platform-payment-runtime-harness.php
            tests/harness/phase-9g-h12-php-harness.php
          )
          for h in "${harnesses[@]}"; do
            echo "===== $h ====="
            set +e
            output="$(php -d error_reporting=E_ALL -d display_errors=1 "$h" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output" | grep -E '^(FAIL:|Architecture|A5 |Quality|H12|Summary:|TOTAL:)' || true
            echo "exit=$status"
          done
          echo '===== bootstrap measurements ====='
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('UPayments.php')
          b=p.read_bytes()
          normalized=b.replace(b'\r\n',b'\n').replace(b'\r',b'\n')
          print('bytes=',len(b),sep='')
          print('lines_splitlines=',len(b.splitlines()),sep='')
          print('newline_count=',b.count(b'\n'),sep='')
          print('sha256_raw=',hashlib.sha256(b).hexdigest(),sep='')
          print('sha256_lf=',hashlib.sha256(normalized).hexdigest(),sep='')
          PY
