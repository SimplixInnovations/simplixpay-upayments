name: Temporary R1 H12 diagnostics

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Sweep every permanent PHP harness
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r h; do
            set +e
            output="$(php -d error_reporting=E_ALL -d display_errors=1 "$h" 2>&1)"
            status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              echo "===== NONZERO $h exit=$status ====="
              printf '%s\n' "$output"
            fi
          done < <(find tests/harness -maxdepth 1 -type f -name '*-harness.php' | sort)
          echo '===== bootstrap measurements ====='
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('UPayments.php').read_bytes()
          normalized=b.replace(b'\r\n',b'\n').replace(b'\r',b'\n')
          print('bytes=',len(b),sep='')
          print('lines_splitlines=',len(b.splitlines()),sep='')
          print('newline_count=',b.count(b'\n'),sep='')
          print('sha256_raw=',hashlib.sha256(b).hexdigest(),sep='')
          print('sha256_lf=',hashlib.sha256(normalized).hexdigest(),sep='')
          PY
