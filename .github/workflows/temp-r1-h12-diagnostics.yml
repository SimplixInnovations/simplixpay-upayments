name: Temporary R1 H12 ratchet repair

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Apply exact permanent-harness repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              source = p.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              p.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tests/harness/architecture-checkout-orchestration-harness.php',
              "require_once $payloadPath;",
              "require_once $root . '/src/Provider/MultiMerchantContract.php';\nrequire_once $payloadPath;",
              'A5 shared provider dependency',
          )

          replace_once(
              'tests/harness/architecture-foundation-harness.php',
              "$gatewayOrderPresentation = arch_read($root, 'src/Gateway/OrderPresentation.php');",
              "$gatewayOrderPresentation = arch_read($root, 'src/Gateway/OrderPresentation.php');\n$multiMerchantContract = arch_read($root, 'src/Provider/MultiMerchantContract.php');",
              'architecture contract source',
          )
          replace_once(
              'tests/harness/architecture-foundation-harness.php',
              "$acceptedGatewayBytes = 86171;",
              "$acceptedGatewayBytes = 86237;",
              'architecture bootstrap byte ratchet',
          )
          replace_once(
              'tests/harness/architecture-foundation-harness.php',
              "arch_assert(arch_contains($gatewayOrderPresentation, 'namespace Simplixi\\\\SUPCheckout\\\\Gateway;'), 'R1 Gateway OrderPresentation uses SUPCheckout Gateway namespace');",
              "arch_assert(arch_contains($gatewayOrderPresentation, 'namespace Simplixi\\\\SUPCheckout\\\\Gateway;'), 'R1 Gateway OrderPresentation uses SUPCheckout Gateway namespace');\narch_assert(is_file($root . '/src/Provider/MultiMerchantContract.php'), 'R1 Provider MultiMerchantContract boundary exists');\narch_assert(arch_contains($multiMerchantContract, 'namespace Simplixi\\\\SUPCheckout\\\\Provider;'), 'R1 Provider MultiMerchantContract uses SUPCheckout Provider namespace');",
              'architecture provider-boundary assertions',
          )

          replace_once(
              'tests/harness/quality-platform-payment-runtime-harness.php',
              "$lifecycle = q17_read($root, 'src/Payment/PaymentLifecycle.php');",
              "$lifecycle = q17_read($root, 'src/Payment/PaymentLifecycle.php');\n$multi_merchant_contract = q17_read($root, 'src/Provider/MultiMerchantContract.php');",
              'Q17 shared contract source',
          )
          replace_once(
              'tests/harness/quality-platform-payment-runtime-harness.php',
              "q17_assert(q17_has($checkout, \"preg_match('/^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}\\\\\\\\z/', \\$iban)\"), 'provider IBAN uses absolute end anchor');",
              "q17_assert(\n    q17_has($checkout, 'MultiMerchantContract::is_valid_iban($iban)')\n    && q17_has($multi_merchant_contract, \"preg_match('/^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}\\\\\\\\z/', \\$value)\"),\n    'provider IBAN delegates to strict absolute-end shared contract'\n);",
              'Q17 shared IBAN contract',
          )
          PY

      - name: Verify exact diff and syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx 'tests/harness/architecture-checkout-orchestration-harness.php'
          printf '%s\n' "${changed[@]}" | grep -Fx 'tests/harness/architecture-foundation-harness.php'
          printf '%s\n' "${changed[@]}" | grep -Fx 'tests/harness/quality-platform-payment-runtime-harness.php'
          php -l tests/harness/architecture-checkout-orchestration-harness.php
          php -l tests/harness/architecture-foundation-harness.php
          php -l tests/harness/quality-platform-payment-runtime-harness.php

      - name: Verify repaired owners and all permanent PHP harnesses
        shell: bash
        run: |
          set -euo pipefail
          php -d error_reporting=E_ALL -d display_errors=1 tests/harness/architecture-checkout-orchestration-harness.php
          php -d error_reporting=E_ALL -d display_errors=1 tests/harness/architecture-foundation-harness.php
          php -d error_reporting=E_ALL -d display_errors=1 tests/harness/quality-platform-payment-runtime-harness.php
          while IFS= read -r h; do
            echo "==> $h"
            php -d error_reporting=E_ALL -d display_errors=1 "$h"
          done < <(find tests/harness -maxdepth 1 -type f -name '*-harness.php' | sort)
          node --check tests/harness/phase-9g-h12-blocks-harness.js
          node tests/harness/phase-9g-h12-blocks-harness.js

      - name: Commit exact permanent-harness repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/harness/architecture-checkout-orchestration-harness.php tests/harness/architecture-foundation-harness.php tests/harness/quality-platform-payment-runtime-harness.php
          git diff --cached --check
          git commit -m 'test: reconcile R1 multi-merchant architecture ratchets'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
