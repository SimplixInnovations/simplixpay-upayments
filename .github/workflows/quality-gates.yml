name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Required control files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            README.md
            CHANGELOG.md
            LICENSE
            NOTICE.md
            SECURITY.md
            SUPPORT.md
            .distignore
            .github/CODEOWNERS
            composer.json
            composer.lock
            phpcs.xml.dist
            phpstan.neon.dist
            phpunit.xml.dist
            tests/harness/quality-platform-foundation-harness.php
            tests/harness/quality-platform-static-analysis-harness.php
            tests/harness/quality-platform-payment-concurrency-harness.php
            tests/harness/quality-platform-authenticated-status-harness.php
            tests/harness/quality-platform-payment-method-availability-harness.php
            tests/harness/quality-platform-gateway-settings-harness.php
            tests/harness/quality-platform-public-order-status-harness.php
            tests/harness/quality-platform-release-identity-harness.php
            tests/harness/quality-platform-migration-settings-harness.php
            docs/project/PROJECT-STATUS.md
            docs/project/PHASE-0-RELEASE-IDENTITY.md
            docs/project/PHASE-9I-MIGRATION.md
            docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
            docs/project/SECURITY-THREAT-MODEL.md
            docs/project/ARCHITECTURE-CODE-QUALITY.md
            docs/project/QUALITY-PLATFORM.md
            docs/project/REPOSITORY-READINESS.md
            docs/project/REPOSITORY-AUDIT.md
            docs/project/NAMING-IDENTITY-STANDARD.md
            docs/project/MASTER-ENGINEERING-PLAYBOOK.md
            docs/project/NEW-CHAT-HANDOFF.md
            docs/project/BASELINE-H12.md
            docs/history/H12-ENGINEERING-CHANGELOG.md
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing or empty required control file: $path"; exit 1; }
          done

      - name: Repository identity invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SimplixPay for UPayments' README.md
          grep -Fq '**Canonical slug:** `simplixpay-upayments`' docs/project/NAMING-IDENTITY-STANDARD.md
          grep -Fq 'SimplixInnovations/simplixpay-upayments' AGENTS.md
          grep -Fq 'upayments' docs/project/NAMING-IDENTITY-STANDARD.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/PHASE-0-RELEASE-IDENTITY.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/PHASE-9I-MIGRATION.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/SECURITY-THREAT-MODEL.md
          grep -Fq '**Status:** DONE / VERIFIED (DISCOVERY + A1-A5)' docs/project/ARCHITECTURE-CODE-QUALITY.md
          grep -Fq '**Status:** Q9 / IMPLEMENTATION' docs/project/QUALITY-PLATFORM.md
          grep -Fq '| Phase 0 — release identity/updater ownership | **DONE / VERIFIED** |' docs/project/PROJECT-STATUS.md
          grep -Fq '| Phase 9I — historical token-identity migration | **DONE / VERIFIED** |' docs/project/PROJECT-STATUS.md
          grep -Fq '| Provider Contract & Payment Lifecycle | **DONE / VERIFIED** |' docs/project/PROJECT-STATUS.md
          grep -Fq '| Security Threat-Model Closure | **DONE / VERIFIED** |' docs/project/PROJECT-STATUS.md
          grep -Fq '| Current program gate | **Full Automated Quality Platform — Q9** |' docs/project/PROJECT-STATUS.md
          grep -Fq 'The current program gate is **Full Automated Quality Platform — Q9**.' README.md
          grep -Fq '**Full Automated Quality Platform — Q9** is now the active gate.' CHANGELOG.md
          grep -Fq '6. **Full Automated Quality Platform — CURRENT GATE / Q9**' docs/ENGINEERING-ROADMAP.md
          grep -Fq '| Security threat-model audit | **DONE / VERIFIED** | Critical |' docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          grep -Fq '| Architecture/code quality | **DONE / VERIFIED (A1-A5)** | High |' docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          grep -Fq '| Full automated quality platform | **Q9 — CURRENT GATE; Q1-Q8 DONE / VERIFIED** | Critical before public stable |' docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          grep -Fq 'The current owner/gate is **Full Automated Quality Platform — Q9**' docs/project/REPOSITORY-AUDIT.md
          grep -Fq 'the current permitted program gate is **Full Automated Quality Platform — Q9**' docs/project/REPOSITORY-READINESS.md
          grep -Fq 'the current permitted gate is **Full Automated Quality Platform — Q9**' docs/project/PHASE-0-RELEASE-IDENTITY.md
          grep -Fq 'The current program gate is **Full Automated Quality Platform — Q9**' docs/project/PHASE-9I-MIGRATION.md
          grep -Fq 'The current permitted program gate is **Full Automated Quality Platform — Q9**' docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
          grep -Fq -- '- Current program gate: **Full Automated Quality Platform — Q9**' docs/project/NEW-CHAT-HANDOFF.md

      - name: Reject stale gate ownership markers
        shell: bash
        run: |
          set -euo pipefail

          live_gate_files=(
            AGENTS.md
            README.md
            CHANGELOG.md
            docs/ENGINEERING-ROADMAP.md
            docs/project/PROJECT-STATUS.md
            docs/project/MASTER-ENGINEERING-PLAYBOOK.md
            docs/project/NEW-CHAT-HANDOFF.md
            docs/project/PHASE-0-RELEASE-IDENTITY.md
            docs/project/PHASE-9I-MIGRATION.md
            docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
            docs/project/REPOSITORY-AUDIT.md
            docs/project/REPOSITORY-READINESS.md
            docs/project/SECURITY-THREAT-MODEL.md
            docs/project/ARCHITECTURE-CODE-QUALITY.md
            docs/project/QUALITY-PLATFORM.md
          )

          reject_across_live_records() {
            local marker="$1"
            if grep -FnH -F -- "$marker" "${live_gate_files[@]}"; then
              echo "Obsolete live gate marker detected: ${marker}"
              exit 1
            fi
          }

          reject_across_live_records 'Security Threat-Model Closure — DISCOVERY'
          reject_across_live_records 'Security Threat-Model Closure — CURRENT GATE / DISCOVERY'
          reject_across_live_records 'Security Threat-Model Closure — **CURRENT / DISCOVERY**'
          reject_across_live_records 'Security threat-model audit | **DISCOVERY — CURRENT GATE**'
          reject_across_live_records 'Security Threat-Model Closure — **DISCOVERY / CURRENT GATE**'
          reject_across_live_records '## Current program gate — Security Threat-Model Closure'
          reject_across_live_records '## Current engineering gate — Security Threat-Model Closure'
          reject_across_live_records '## Next gate — Security Threat-Model Closure'
          reject_across_live_records '| Current program gate | **Architecture & Code-Quality Foundation — A5** |'
          reject_across_live_records 'Architecture & Code-Quality Foundation — CURRENT GATE / A5'
          reject_across_live_records 'Architecture/code quality | **A5 — CURRENT GATE**'
          reject_across_live_records 'Current program gate: Architecture & Code-Quality Foundation — A5'
          reject_across_live_records '| Current program gate | **Full Automated Quality Platform — Q1** |'
          reject_across_live_records 'Full Automated Quality Platform — CURRENT GATE / Q1'
          reject_across_live_records 'Full automated quality platform | **Q1 — CURRENT GATE**'
          reject_across_live_records 'Current program gate: **Full Automated Quality Platform — Q1**'
          reject_across_live_records 'CURRENT / Q1'
          reject_across_live_records '| Current program gate | **Full Automated Quality Platform — Q2** |'
          reject_across_live_records 'Full Automated Quality Platform — CURRENT GATE / Q2'
          reject_across_live_records 'Full automated quality platform | **Q2 — CURRENT GATE'
          reject_across_live_records 'Current program gate: **Full Automated Quality Platform — Q2**'
          reject_across_live_records 'CURRENT / Q2'
          reject_across_live_records '**Status:** Q2 / IMPLEMENTATION'
          reject_across_live_records '| Current program gate | **Full Automated Quality Platform — Q3** |'
          reject_across_live_records 'Full Automated Quality Platform — CURRENT GATE / Q3'
          reject_across_live_records 'Full automated quality platform | **Q3 — CURRENT GATE'
          reject_across_live_records 'Current program gate: **Full Automated Quality Platform — Q3**'
          reject_across_live_records 'CURRENT / Q3'
          reject_across_live_records '**Status:** Q3 / IMPLEMENTATION'
          reject_across_live_records '| Current program gate | **Full Automated Quality Platform — Q4** |'
          reject_across_live_records 'Full Automated Quality Platform — CURRENT GATE / Q4'
          reject_across_live_records 'Full automated quality platform | **Q4 — CURRENT GATE'
          reject_across_live_records 'Current program gate: **Full Automated Quality Platform — Q4**'
          reject_across_live_records 'CURRENT / Q4'
          reject_across_live_records '**Status:** Q4 / IMPLEMENTATION'
          reject_across_live_records '| Current program gate | **Full Automated Quality Platform — Q5** |'
          reject_across_live_records 'Full Automated Quality Platform — CURRENT GATE / Q5'
          reject_across_live_records 'Full automated quality platform | **Q5 — CURRENT GATE'
          reject_across_live_records 'Current program gate: **Full Automated Quality Platform — Q5**'
          reject_across_live_records 'CURRENT / Q5'
          reject_across_live_records '**Status:** Q5 / IMPLEMENTATION'
          reject_across_live_records '| Current program gate | **Full Automated Quality Platform — Q6** |'
          reject_across_live_records 'Full Automated Quality Platform — CURRENT GATE / Q6'
          reject_across_live_records 'Full automated quality platform | **Q6 — CURRENT GATE'
          reject_across_live_records 'Current program gate: **Full Automated Quality Platform — Q6**'
          reject_across_live_records 'CURRENT / Q6'
          reject_across_live_records '**Status:** Q6 / IMPLEMENTATION'
          reject_across_live_records '| Current program gate | **Full Automated Quality Platform — Q7** |'
          reject_across_live_records 'Full Automated Quality Platform — CURRENT GATE / Q7'
          reject_across_live_records 'Full automated quality platform | **Q7 — CURRENT GATE'
          reject_across_live_records 'Current program gate: **Full Automated Quality Platform — Q7**'
          reject_across_live_records 'CURRENT / Q7'
          reject_across_live_records '**Status:** Q7 / IMPLEMENTATION'
          reject_across_live_records '| Current program gate | **Full Automated Quality Platform — Q8** |'
          reject_across_live_records 'Full Automated Quality Platform — CURRENT GATE / Q8'
          reject_across_live_records 'Full automated quality platform | **Q8 — CURRENT GATE'
          reject_across_live_records 'Current program gate: **Full Automated Quality Platform — Q8**'
          reject_across_live_records 'CURRENT / Q8'
          reject_across_live_records '**Status:** Q8 / IMPLEMENTATION'

          if grep -FnH -F -- '**Current program status:** DISCOVERY / CURRENT GATE.' docs/project/MASTER-ENGINEERING-PLAYBOOK.md; then
            echo 'Obsolete Security program-status marker detected in Master Playbook.'
            exit 1
          fi

          if grep -FnH -F -- '**Status:** IMPLEMENTATION / REVIEW' docs/project/SECURITY-THREAT-MODEL.md; then
            echo 'Security record regressed to an in-flight status.'
            exit 1
          fi
          if grep -FnH -F -- '**Current branch:** `security/threat-model-discovery`' docs/project/SECURITY-THREAT-MODEL.md; then
            echo 'Security record regressed to the deleted implementation branch.'
            exit 1
          fi

          if grep -FnH -F -- 'The next permitted implementation gate is **Phase 9I — Historical token-identity migration**' docs/project/PHASE-0-RELEASE-IDENTITY.md; then
            echo 'Phase 0 record regressed to a stale next-gate instruction.'
            exit 1
          fi
          if grep -FnH -F -- "Phase 0 is now permitted under the repository's normal PR/CI/review controls." docs/project/REPOSITORY-READINESS.md; then
            echo 'Repository Readiness record regressed to stale live Phase 0 wording.'
            exit 1
          fi
          if grep -FnH -F -- 'The next permitted runtime-changing work is **Phase 0 — SimplixPay release identity and updater ownership**.' docs/project/REPOSITORY-READINESS.md; then
            echo 'Repository Readiness record regressed to a stale next-gate instruction.'
            exit 1
          fi

      - name: Whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi

  quality-platform:
    name: Quality Platform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:2.10.3

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked development toolchain
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Unit and static quality gates
        run: composer quality

  php-syntax-compatibility:
    name: PHP ${{ matrix.php }} syntax (not certification)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '8.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Distributed PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.php' ':(exclude)tests/**' | xargs -0 -r -n1 php -l

  h12-regression:
    name: H12 Regression Harness
    needs:
      - quality-platform
      - php-syntax-compatibility
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require upstream quality prerequisites
        shell: bash
        env:
          QUALITY_PLATFORM_RESULT: ${{ needs.quality-platform.result }}
          PHP_SYNTAX_RESULT: ${{ needs.php-syntax-compatibility.result }}
        run: |
          set -euo pipefail
          if [[ "${QUALITY_PLATFORM_RESULT}" != "success" || "${PHP_SYNTAX_RESULT}" != "success" ]]; then
            echo "Required quality prerequisite failed: quality-platform=${QUALITY_PLATFORM_RESULT}, php-syntax-compatibility=${PHP_SYNTAX_RESULT}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Tracked PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.php' | xargs -0 -r -n1 php -l

      - name: Phase 0 release identity harness
        run: php tests/harness/phase-0-release-identity-harness.php

      - name: Phase 9I migration preflight harness
        run: php tests/harness/phase-9i-preflight-harness.php

      - name: Phase 9I migration executor harness
        run: php tests/harness/phase-9i-executor-harness.php

      - name: Phase 9I operations harness
        run: php tests/harness/phase-9i-operations-harness.php

      - name: Provider payment lifecycle harness
        run: php tests/harness/provider-payment-lifecycle-harness.php

      - name: Provider exact amount binding harness
        run: php tests/harness/provider-payment-amount-binding-harness.php

      - name: Security threat-model harness
        run: php tests/harness/security-threat-model-harness.php

      - name: Architecture foundation harness
        run: php tests/harness/architecture-foundation-harness.php

      - name: Architecture runtime bindings harness
        run: php tests/harness/architecture-runtime-bindings-harness.php

      - name: Architecture bootstrap paths harness
        run: php tests/harness/architecture-bootstrap-path-harness.php

      - name: Architecture provider endpoints harness
        run: php tests/harness/architecture-provider-endpoints-harness.php

      - name: Architecture payment-method availability harness
        run: php tests/harness/architecture-payment-method-availability-harness.php

      - name: Architecture gateway settings harness
        run: php tests/harness/architecture-gateway-settings-harness.php

      - name: Architecture subscription presentation harness
        run: php tests/harness/architecture-subscription-presentation-harness.php

      - name: Architecture checkout orchestration harness
        run: php tests/harness/architecture-checkout-orchestration-harness.php

      - name: Quality platform foundation harness
        run: php tests/harness/quality-platform-foundation-harness.php

      - name: Quality platform static-analysis harness
        run: php tests/harness/quality-platform-static-analysis-harness.php

      - name: Quality platform payment-concurrency harness
        run: php tests/harness/quality-platform-payment-concurrency-harness.php

      - name: Quality platform authenticated-status harness
        run: php tests/harness/quality-platform-authenticated-status-harness.php

      - name: Quality platform payment-method availability harness
        run: php tests/harness/quality-platform-payment-method-availability-harness.php

      - name: Quality platform gateway-settings harness
        run: php tests/harness/quality-platform-gateway-settings-harness.php

      - name: Quality platform public-order-status harness
        run: php tests/harness/quality-platform-public-order-status-harness.php

      - name: Quality platform release-identity harness
        run: php tests/harness/quality-platform-release-identity-harness.php

      - name: Quality platform migration-settings harness
        run: php tests/harness/quality-platform-migration-settings-harness.php

      - name: H12 PHP harness
        run: php tests/harness/phase-9g-h12-php-harness.php

      - name: Blocks harness syntax
        run: node --check tests/harness/phase-9g-h12-blocks-harness.js

      - name: H12 Blocks harness
        run: node tests/harness/phase-9g-h12-blocks-harness.js
