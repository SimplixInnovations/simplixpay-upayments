name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Required control files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            README.md
            CHANGELOG.md
            LICENSE
            NOTICE.md
            SECURITY.md
            SUPPORT.md
            .github/CODEOWNERS
            docs/project/PROJECT-STATUS.md
            docs/project/PHASE-0-RELEASE-IDENTITY.md
            docs/project/PHASE-9I-MIGRATION.md
            docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
            docs/project/SECURITY-THREAT-MODEL.md
            docs/project/ARCHITECTURE-CODE-QUALITY.md
            docs/project/REPOSITORY-READINESS.md
            docs/project/REPOSITORY-AUDIT.md
            docs/project/NAMING-IDENTITY-STANDARD.md
            docs/project/MASTER-ENGINEERING-PLAYBOOK.md
            docs/project/NEW-CHAT-HANDOFF.md
            docs/project/BASELINE-H12.md
            docs/history/H12-ENGINEERING-CHANGELOG.md
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing or empty required control file: $path"; exit 1; }
          done

      - name: Repository identity invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SimplixPay for UPayments' README.md
          grep -Fq '**Canonical slug:** `simplixpay-upayments`' docs/project/NAMING-IDENTITY-STANDARD.md
          grep -Fq 'SimplixInnovations/simplixpay-upayments' AGENTS.md
          grep -Fq 'upayments' docs/project/NAMING-IDENTITY-STANDARD.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/PHASE-0-RELEASE-IDENTITY.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/PHASE-9I-MIGRATION.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/SECURITY-THREAT-MODEL.md
          grep -Fq '**Status:** A5 / IMPLEMENTATION' docs/project/ARCHITECTURE-CODE-QUALITY.md
          grep -Fq '| Phase 0 — release identity/updater ownership | **DONE / VERIFIED** |' docs/project/PROJECT-STATUS.md
          grep -Fq '| Phase 9I — historical token-identity migration | **DONE / VERIFIED** |' docs/project/PROJECT-STATUS.md
          grep -Fq '| Provider Contract & Payment Lifecycle | **DONE / VERIFIED** |' docs/project/PROJECT-STATUS.md
          grep -Fq '| Security Threat-Model Closure | **DONE / VERIFIED** |' docs/project/PROJECT-STATUS.md
          grep -Fq '| Current program gate | **Architecture & Code-Quality Foundation — A5** |' docs/project/PROJECT-STATUS.md
          grep -Fq 'The current program gate is **Architecture & Code-Quality Foundation — A5**.' README.md
          grep -Fq '**Architecture & Code-Quality Foundation — A5** is now the active gate.' CHANGELOG.md
          grep -Fq '5. **Architecture & Code-Quality Foundation — CURRENT GATE / A5**' docs/ENGINEERING-ROADMAP.md
          grep -Fq '| Security threat-model audit | **DONE / VERIFIED** | Critical |' docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          grep -Fq '| Architecture/code quality | **A5 — CURRENT GATE** | High |' docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          grep -Fq 'The current owner/gate is **Architecture & Code-Quality Foundation — A5**' docs/project/REPOSITORY-AUDIT.md
          grep -Fq 'the current permitted program gate is **Architecture & Code-Quality Foundation — A5**' docs/project/REPOSITORY-READINESS.md
          grep -Fq 'the current permitted gate is **Architecture & Code-Quality Foundation — A5**' docs/project/PHASE-0-RELEASE-IDENTITY.md
          grep -Fq 'The current program gate is **Architecture & Code-Quality Foundation — A5**' docs/project/PHASE-9I-MIGRATION.md
          grep -Fq 'The current permitted program gate is **Architecture & Code-Quality Foundation — A5**' docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
          grep -Fq -- '- Current program gate: **Architecture & Code-Quality Foundation — A5**' docs/project/NEW-CHAT-HANDOFF.md

      - name: Reject stale gate ownership markers
        shell: bash
        run: |
          set -euo pipefail

          live_gate_files=(
            AGENTS.md
            README.md
            CHANGELOG.md
            docs/ENGINEERING-ROADMAP.md
            docs/project/PROJECT-STATUS.md
            docs/project/MASTER-ENGINEERING-PLAYBOOK.md
            docs/project/NEW-CHAT-HANDOFF.md
            docs/project/PHASE-0-RELEASE-IDENTITY.md
            docs/project/PHASE-9I-MIGRATION.md
            docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
            docs/project/REPOSITORY-AUDIT.md
            docs/project/REPOSITORY-READINESS.md
            docs/project/SECURITY-THREAT-MODEL.md
            docs/project/ARCHITECTURE-CODE-QUALITY.md
          )

          reject_across_live_records() {
            local marker="$1"
            if grep -FnH -F -- "$marker" "${live_gate_files[@]}"; then
              echo "Obsolete live gate marker detected: ${marker}"
              exit 1
            fi
          }

          reject_across_live_records 'Security Threat-Model Closure — DISCOVERY'
          reject_across_live_records 'Security Threat-Model Closure — CURRENT GATE / DISCOVERY'
          reject_across_live_records 'Security Threat-Model Closure — **CURRENT / DISCOVERY**'
          reject_across_live_records 'Security threat-model audit | **DISCOVERY — CURRENT GATE**'
          reject_across_live_records 'Security Threat-Model Closure — **DISCOVERY / CURRENT GATE**'
          reject_across_live_records '## Current program gate — Security Threat-Model Closure'
          reject_across_live_records '## Current engineering gate — Security Threat-Model Closure'
          reject_across_live_records '## Next gate — Security Threat-Model Closure'

          if grep -FnH -F -- '**Current program status:** DISCOVERY / CURRENT GATE.' docs/project/MASTER-ENGINEERING-PLAYBOOK.md; then
            echo 'Obsolete Security program-status marker detected in Master Playbook.'
            exit 1
          fi

          if grep -FnH -F -- '**Status:** IMPLEMENTATION / REVIEW' docs/project/SECURITY-THREAT-MODEL.md; then
            echo 'Security record regressed to an in-flight status.'
            exit 1
          fi
          if grep -FnH -F -- '**Current branch:** `security/threat-model-discovery`' docs/project/SECURITY-THREAT-MODEL.md; then
            echo 'Security record regressed to the deleted implementation branch.'
            exit 1
          fi

          if grep -FnH -F -- 'The next permitted implementation gate is **Phase 9I — Historical token-identity migration**' docs/project/PHASE-0-RELEASE-IDENTITY.md; then
            echo 'Phase 0 record regressed to a stale next-gate instruction.'
            exit 1
          fi
          if grep -FnH -F -- "Phase 0 is now permitted under the repository's normal PR/CI/review controls." docs/project/REPOSITORY-READINESS.md; then
            echo 'Repository Readiness record regressed to stale live Phase 0 wording.'
            exit 1
          fi
          if grep -FnH -F -- 'The next permitted runtime-changing work is **Phase 0 — SimplixPay release identity and updater ownership**.' docs/project/REPOSITORY-READINESS.md; then
            echo 'Repository Readiness record regressed to a stale next-gate instruction.'
            exit 1
          fi

      - name: Whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi

  h12-regression:
    name: H12 Regression Harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Tracked PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.php' | xargs -0 -r -n1 php -l

      - name: Phase 0 release identity harness
        run: php tests/harness/phase-0-release-identity-harness.php

      - name: Phase 9I migration preflight harness
        run: php tests/harness/phase-9i-preflight-harness.php

      - name: Phase 9I migration executor harness
        run: php tests/harness/phase-9i-executor-harness.php

      - name: Phase 9I operations harness
        run: php tests/harness/phase-9i-operations-harness.php

      - name: Provider payment lifecycle harness
        run: php tests/harness/provider-payment-lifecycle-harness.php

      - name: Provider exact amount binding harness
        run: php tests/harness/provider-payment-amount-binding-harness.php

      - name: Security threat-model harness
        run: php tests/harness/security-threat-model-harness.php

      - name: Architecture foundation harness
        run: php tests/harness/architecture-foundation-harness.php

      - name: Architecture runtime bindings harness
        run: php tests/harness/architecture-runtime-bindings-harness.php

      - name: Architecture bootstrap paths harness
        run: php tests/harness/architecture-bootstrap-path-harness.php

      - name: Architecture provider endpoints harness
        run: php tests/harness/architecture-provider-endpoints-harness.php

      - name: Architecture payment-method availability harness
        run: php tests/harness/architecture-payment-method-availability-harness.php

      - name: Architecture gateway settings harness
        run: php tests/harness/architecture-gateway-settings-harness.php

      - name: Architecture subscription presentation harness
        run: php tests/harness/architecture-subscription-presentation-harness.php

      - name: Architecture checkout orchestration harness
        run: php tests/harness/architecture-checkout-orchestration-harness.php

      - name: H12 PHP harness
        run: php tests/harness/phase-9g-h12-php-harness.php

      - name: Blocks harness syntax
        run: node --check tests/harness/phase-9g-h12-blocks-harness.js

      - name: H12 Blocks harness
        run: node tests/harness/phase-9g-h12-blocks-harness.js
