name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Required control files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md README.md CHANGELOG.md LICENSE NOTICE.md SECURITY.md SUPPORT.md
            .distignore .github/CODEOWNERS
            composer.json composer.lock phpcs.xml.dist phpstan.neon.dist phpunit.xml.dist
            .github/workflows/quality-gates.yml
            .github/workflows/compatibility-certification.yml
            .github/workflows/provider-sandbox-certification.yml
            .github/workflows/release-artifact.yml
            scripts/build-release.sh scripts/verify-release.sh scripts/install-wp-test-environment.sh
            tests/harness/release-artifact-harness.php
            tests/provider/sandbox-charge-smoke.php
            tests/integration/bootstrap.php
            tests/integration/PluginActivationTest.php
            tests/integration/CheckoutRegistrationTest.php
            tests/integration/HposCompatibilityTest.php
            tests/integration/ReleaseMetadataTest.php
            tests/integration/SavedCardRuntimeTest.php
            tests/integration/SubscriptionRuntimeTest.php
            tests/integration/MultiMerchantRuntimeTest.php
            tests/integration/OperationsRuntimeTest.php
            tests/integration/UpgradeCompatibilityTest.php
            docs/COMPATIBILITY.md docs/ENGINEERING-ROADMAP.md
            docs/project/PROJECT-STATUS.md
            docs/project/ENTERPRISE-CERTIFICATION.md
            docs/project/RELEASE-ENGINEERING.md
            docs/project/NEW-CHAT-HANDOFF.md
            docs/project/NAMING-IDENTITY-STANDARD.md
            docs/project/PHASE-0-RELEASE-IDENTITY.md
            docs/project/PHASE-9I-MIGRATION.md
            docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
            docs/project/SECURITY-THREAT-MODEL.md
            docs/project/ARCHITECTURE-CODE-QUALITY.md
            docs/project/QUALITY-PLATFORM.md
            docs/project/BASELINE-H12.md
            docs/superpowers/plans/2026-09-06-enterprise-completion.md
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing or empty required control file: $path"; exit 1; }
          done

      - name: Current living-state invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SimplixPay for UPayments' README.md
          grep -Fq 'The current program gate is **Enterprise Release Candidate Closeout — CURRENT / FINAL VERIFICATION**.' README.md
          grep -Fq '| Current program gate | **Enterprise Release Candidate Closeout — CURRENT / FINAL VERIFICATION** |' docs/project/PROJECT-STATUS.md
          grep -Fq 'Task 7 — existing-install upgrade / release identity — DONE / VERIFIED' docs/ENGINEERING-ROADMAP.md
          grep -Fq 'Task 8 — Enterprise Release Candidate Closeout — CURRENT / FINAL VERIFICATION' docs/ENGINEERING-ROADMAP.md
          grep -Fq '**Status:** TASKS 1–7 DONE / VERIFIED; TASK 8 RELEASE-CANDIDATE CLOSEOUT CURRENT' docs/project/ENTERPRISE-CERTIFICATION.md
          grep -Fq '**Status:** TASKS 5 & 7 DONE / VERIFIED; TASK 8 RELEASE-CANDIDATE CLOSEOUT CURRENT' docs/project/RELEASE-ENGINEERING.md
          grep -Fq -- '- Current gate — **Enterprise Release Candidate Closeout — CURRENT / FINAL VERIFICATION**' docs/project/NEW-CHAT-HANDOFF.md
          grep -Fq 'The current named gate is **Enterprise Release Candidate Closeout**.' AGENTS.md
          grep -Fq 'main file: `UPayments.php`' docs/project/PROJECT-STATUS.md
          grep -Fq 'text domain: `upayments`' docs/project/PROJECT-STATUS.md
          grep -Fq '**Unsupported**' docs/COMPATIBILITY.md
          grep -Fq '**External/manual**' docs/COMPATIBILITY.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/PHASE-0-RELEASE-IDENTITY.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/PHASE-9I-MIGRATION.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/PROVIDER-PAYMENT-LIFECYCLE.md
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/SECURITY-THREAT-MODEL.md
          grep -Fq '**Status:** DONE / VERIFIED (DISCOVERY + A1-A5)' docs/project/ARCHITECTURE-CODE-QUALITY.md
          grep -Fq '**Status:** DONE / VERIFIED (Q1-Q19)' docs/project/QUALITY-PLATFORM.md
          grep -Fq '**Canonical slug:** `simplixpay-upayments`' docs/project/NAMING-IDENTITY-STANDARD.md

      - name: Reject stale current-gate ownership in living records
        shell: bash
        run: |
          set -euo pipefail
          living=(
            AGENTS.md README.md docs/ENGINEERING-ROADMAP.md docs/COMPATIBILITY.md
            docs/project/PROJECT-STATUS.md docs/project/ENTERPRISE-CERTIFICATION.md
            docs/project/RELEASE-ENGINEERING.md docs/project/NEW-CHAT-HANDOFF.md
          )
          stale=(
            'Enterprise Compatibility Certification — CURRENT GATE'
            'current program gate is **Enterprise Compatibility Certification**'
            'Current program gate: **Enterprise Compatibility Certification**'
            'Full Automated Quality Platform — CURRENT GATE'
            'Security Threat-Model Closure — CURRENT GATE'
            'Architecture & Code-Quality Foundation — CURRENT GATE'
          )
          for marker in "${stale[@]}"; do
            if grep -FnH -F -- "$marker" "${living[@]}"; then
              echo "Stale current-gate marker in living record: $marker"
              exit 1
            fi
          done

      - name: Whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi

  quality-platform:
    name: Quality Platform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:2.10.3
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install locked development toolchain
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Unit and static quality gates
        run: composer quality

  php-syntax-compatibility:
    name: PHP ${{ matrix.php }} syntax (not certification)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '8.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Distributed PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.php' ':(exclude)tests/**' | xargs -0 -r -n1 php -l

  h12-regression:
    name: H12 Regression Harness
    needs: [quality-platform, php-syntax-compatibility]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require upstream quality prerequisites
        shell: bash
        env:
          QUALITY_PLATFORM_RESULT: ${{ needs.quality-platform.result }}
          PHP_SYNTAX_RESULT: ${{ needs.php-syntax-compatibility.result }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_PLATFORM_RESULT" != success || "$PHP_SYNTAX_RESULT" != success ]]; then
            echo "Required quality prerequisite failed: quality-platform=$QUALITY_PLATFORM_RESULT php-syntax=$PHP_SYNTAX_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Tracked PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -r -n1 php -l
      - name: Phase 0 release identity harness
        run: php tests/harness/phase-0-release-identity-harness.php
      - name: Phase 9I migration preflight harness
        run: php tests/harness/phase-9i-preflight-harness.php
      - name: Phase 9I migration executor harness
        run: php tests/harness/phase-9i-executor-harness.php
      - name: Phase 9I operations harness
        run: php tests/harness/phase-9i-operations-harness.php
      - name: Provider payment lifecycle harness
        run: php tests/harness/provider-payment-lifecycle-harness.php
      - name: Provider exact amount binding harness
        run: php tests/harness/provider-payment-amount-binding-harness.php
      - name: Security threat-model harness
        run: php tests/harness/security-threat-model-harness.php
      - name: Architecture foundation harness
        run: php tests/harness/architecture-foundation-harness.php
      - name: Architecture runtime bindings harness
        run: php tests/harness/architecture-runtime-bindings-harness.php
      - name: Architecture bootstrap paths harness
        run: php tests/harness/architecture-bootstrap-path-harness.php
      - name: Architecture provider endpoints harness
        run: php tests/harness/architecture-provider-endpoints-harness.php
      - name: Architecture payment-method availability harness
        run: php tests/harness/architecture-payment-method-availability-harness.php
      - name: Architecture gateway settings harness
        run: php tests/harness/architecture-gateway-settings-harness.php
      - name: Architecture subscription presentation harness
        run: php tests/harness/architecture-subscription-presentation-harness.php
      - name: Architecture checkout orchestration harness
        run: php tests/harness/architecture-checkout-orchestration-harness.php
      - name: Quality platform foundation harness
        run: php tests/harness/quality-platform-foundation-harness.php
      - name: Quality platform static-analysis harness
        run: php tests/harness/quality-platform-static-analysis-harness.php
      - name: Quality platform payment-concurrency harness
        run: php tests/harness/quality-platform-payment-concurrency-harness.php
      - name: Quality platform authenticated-status harness
        run: php tests/harness/quality-platform-authenticated-status-harness.php
      - name: Quality platform payment-method availability harness
        run: php tests/harness/quality-platform-payment-method-availability-harness.php
      - name: Quality platform gateway-settings harness
        run: php tests/harness/quality-platform-gateway-settings-harness.php
      - name: Quality platform public-order-status harness
        run: php tests/harness/quality-platform-public-order-status-harness.php
      - name: Quality platform release-identity harness
        run: php tests/harness/quality-platform-release-identity-harness.php
      - name: Quality platform migration-settings harness
        run: php tests/harness/quality-platform-migration-settings-harness.php
      - name: Quality platform migration-bootstrap harness
        run: php tests/harness/quality-platform-migration-bootstrap-harness.php
      - name: Quality platform subscription-composition harness
        run: php tests/harness/quality-platform-subscription-composition-harness.php
      - name: Quality platform subscription-product-type harness
        run: php tests/harness/quality-platform-subscription-product-type-harness.php
      - name: Quality platform migration-CLI harness
        run: php tests/harness/quality-platform-migration-cli-harness.php
      - name: Quality platform migration-admin harness
        run: php tests/harness/quality-platform-migration-admin-harness.php
      - name: Quality platform subscription-presentation harness
        run: php tests/harness/quality-platform-subscription-presentation-harness.php
      - name: Quality platform migration-core harness
        run: php tests/harness/quality-platform-migration-core-harness.php
      - name: Quality platform payment-runtime harness
        run: php tests/harness/quality-platform-payment-runtime-harness.php
      - name: Quality platform Blocks availability harness
        run: php tests/harness/quality-platform-blocks-availability-harness.php
      - name: Quality platform subscription product-eligibility harness
        run: php tests/harness/quality-platform-subscription-product-eligibility-harness.php
      - name: H12 PHP harness
        run: php tests/harness/phase-9g-h12-php-harness.php
      - name: Blocks harness syntax
        run: node --check tests/harness/phase-9g-h12-blocks-harness.js
      - name: H12 Blocks harness
        run: node tests/harness/phase-9g-h12-blocks-harness.js
