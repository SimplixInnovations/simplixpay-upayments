name: One-off Browser Context Patch

on:
  push:
    branches:
      - security/minimize-subscription-browser-context

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/minimize-subscription-browser-context
          fetch-depth: 0
      - name: Apply exact one-line patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('UPayments.php')
          text = path.read_text(encoding='utf-8')
          needle = "                        'userId'     => get_current_user_id(),\n"
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected exactly one target line, found {count}')
          path.write_text(text.replace(needle, '', 1), encoding='utf-8', newline='')
      - name: Remove one-off workflow from resulting tree
        run: git rm .github/workflows/one-off-minimize-browser-context.yml
      - name: Verify exact staged scope
        shell: bash
        run: |
          git add UPayments.php
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "UPayments.php "
          test "$(git diff --cached --numstat -- UPayments.php)" = $'0\t1\tUPayments.php'
          git diff --cached --check
          git diff --cached -- UPayments.php | grep -F -- "-                        'userId'     => get_current_user_id(),"
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: minimize subscription browser identity context'
          git push origin HEAD:security/minimize-subscription-browser-context
