name: Security Hardening Once

on:
  push:
    branches:
      - security/threat-model-discovery

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/threat-model-discovery
          fetch-depth: 0

      - name: Reconcile hardened callback comment
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/Payment/PaymentLifecycle.php')
          text = path.read_text(encoding='utf-8')
          old = '     * WC-API entrypoint. The inherited get_order_status display poll remains delegated.'
          new = '     * WC-API entrypoint. The historical get_order_status poll is intercepted here before inherited priority 10.'
          if text.count(old) != 1:
              raise SystemExit(f'callback comment contract changed: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Run security threat-model harness
        run: php tests/harness/security-threat-model-harness.php

      - name: Verify and commit comment only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          php -l src/Payment/PaymentLifecycle.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Payment/PaymentLifecycle.php
          git diff --cached --quiet && exit 0
          git commit -m 'docs: align hardened callback contract comment'
          git push origin HEAD:security/threat-model-discovery
