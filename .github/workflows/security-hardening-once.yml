name: Security Hardening Once

on:
  push:
    branches:
      - security/threat-model-discovery

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/threat-model-discovery
          fetch-depth: 0

      - name: Apply exact security hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/security-hardening-once.py')
          text = path.read_text(encoding='utf-8')
          old = 're.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 're.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if text.count(old) != 1:
              raise SystemExit('regex helper patch contract changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/scripts/security-hardening-once.py

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          php -l UPayments.php
          php -l src/Payment/PaymentLifecycle.php
          php -l src/Security/PublicOrderStatus.php
          php -l templates/new-design-form.php
          php -l templates/old-design-form.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UPayments.php src/Payment/PaymentLifecycle.php templates/new-design-form.php templates/old-design-form.php
          git diff --cached --quiet && exit 0
          git commit -m 'security: close public and customer action boundaries'
          git push origin HEAD:security/threat-model-discovery
