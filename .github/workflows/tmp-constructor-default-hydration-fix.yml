name: Temporary Constructor Default Hydration Fix

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - .github/workflows/tmp-constructor-default-hydration-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 2

      - name: Verify one-time workflow preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9285533b2b7ac62cc6128b132892f2d04ed11304"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/tmp-constructor-default-hydration-fix.yml"
          test -f scripts/tmp-constructor-default-hydration-fix.py

      - name: Apply exact-preimage constructor correction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-constructor-default-hydration-fix.py

      - name: Verify bounded diff and initialization order
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "UPayments.php"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('UPayments.php').read_text(encoding='utf-8')
          fields = text.find('$this->init_form_fields();')
          settings = text.find('$this->init_settings();')
          title = text.find('$this->title = $this->get_option("title");')
          if not (0 <= fields < settings < title):
              raise SystemExit('Constructor settings order invariant failed')
          if text.count('$this->init_form_fields();') != 1 or text.count('$this->init_settings();') != 1:
              raise SystemExit('Constructor initialization calls not exactly once')
          PY
          test "$(wc -c < UPayments.php)" -eq 86171

      - name: Verify syntax and architecture ratchet
        shell: bash
        run: |
          set -euo pipefail
          php -l UPayments.php
          php tests/harness/architecture-foundation-harness.php

      - name: Commit only verified constructor correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Simplix Innovations'
          git config user.email '136711735+SimplixInnovationsAdmin@users.noreply.github.com'
          git add UPayments.php
          test "$(git diff --cached --name-only)" = "UPayments.php"
          git commit -m 'fix: hydrate gateway defaults before option reads'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
