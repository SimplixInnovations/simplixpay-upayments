name: Reconcile Master Playbook

on:
  push:
    branches:
      - docs/provider-lifecycle-closure

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/provider-lifecycle-closure
          fetch-depth: 0

      - name: Reconcile living playbook state only
        run: python .github/scripts/reconcile-master-playbook.py

      - name: Commit exact reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: reconcile master playbook after lifecycle closure'
          git push origin HEAD:docs/provider-lifecycle-closure
