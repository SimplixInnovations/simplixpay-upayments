name: Phase 9I Fixture Maintenance

on:
  push:
    branches:
      - phase-9i/preflight

permissions:
  contents: write

jobs:
  fix-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-9i/preflight
          persist-credentials: true
      - name: Apply exact fixture correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/harness/phase-9i-preflight-harness.php')
          s = p.read_text()
          old = "    for ($i = 1; $i <= 200; $i++) p9_order($i, 1, null);"
          new = "    for ($i = 1; $i <= 201; $i++) p9_order($i, 1, null);"
          if s.count(old) != 1:
              raise SystemExit('expected fixture line does not occur exactly once')
          p.write_text(s.replace(old, new), newline='\n')
          PY
          git diff --check
          git diff -- tests/harness/phase-9i-preflight-harness.php
          git config user.name 'Simplix Innovations'
          git config user.email '136711735+SimplixInnovationsAdmin@users.noreply.github.com'
          git add tests/harness/phase-9i-preflight-harness.php
          git commit -m 'test: correct Phase 9I over-cap fixture'
          git push origin phase-9i/preflight
