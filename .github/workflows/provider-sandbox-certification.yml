name: Provider Sandbox Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'UPayments.php'
      - 'src/Provider/**'
      - 'src/Payment/CheckoutPayload.php'
      - 'src/Payment/CheckoutOrchestrator.php'
      - 'tests/provider/**'
      - '.github/workflows/provider-sandbox-certification.yml'
  push:
    branches: [main]
    paths:
      - 'UPayments.php'
      - 'src/Provider/**'
      - 'src/Payment/CheckoutPayload.php'
      - 'src/Payment/CheckoutOrchestrator.php'
      - 'tests/provider/**'
      - '.github/workflows/provider-sandbox-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  charge-initialization:
    name: Public sandbox Charge initialization
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: curl
          coverage: none
          tools: none

      - name: Syntax-check provider smoke
        run: php -l tests/provider/sandbox-charge-smoke.php

      - name: Execute one bounded public-sandbox Charge initialization
        env:
          # Public UPayments test credential documented at:
          # https://developers.upayments.com/reference/test-environment-details
          # This is intentionally NOT a repository secret or production token.
          SIMPLIXPAY_UPAYMENTS_SANDBOX_TOKEN: jtest123
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: php tests/provider/sandbox-charge-smoke.php
