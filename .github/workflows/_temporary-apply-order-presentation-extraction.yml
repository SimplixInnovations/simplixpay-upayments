name: Temporary order-presentation ownership applicator

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - '.github/workflows/_temporary-apply-order-presentation-extraction.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Own extracted order-presentation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "263c51f2defdf7928aee978e5ad30115abcbb8cf"
          test "$(wc -c < UPayments.php | tr -d ' ')" = "86457"
          test "$(git hash-object tests/harness/architecture-foundation-harness.php)" = "06af264a559eae83f9e082962e8afc3750212004"
          test "$(git hash-object phpstan.neon.dist)" = "d5f4bec9b264966b0a15f91d0ec368b7e23e5425"
          test "$(git hash-object phpcs.xml.dist)" = "4e7c8b6c3f393d7a5f00d6d6ea9748952f6333df"

          python3 <<'PY'
          from pathlib import Path

          p = Path('tests/harness/architecture-foundation-harness.php')
          s = p.read_text()
          replacements = [
              ("$gatewayAvailability = arch_read($root, 'src/Gateway/Availability.php');\n$gatewayTokens = arch_executable_tokens($gateway);\n",
               "$gatewayAvailability = arch_read($root, 'src/Gateway/Availability.php');\n$gatewayOrderPresentation = arch_read($root, 'src/Gateway/OrderPresentation.php');\n$gatewayTokens = arch_executable_tokens($gateway);\n"),
              ("// src/Gateway/Availability.php while retaining the global callback as a thin adapter.\n$acceptedGatewayBytes = 86992;\n",
               "// src/Gateway/Availability.php while retaining the global callback as a thin adapter.\n// R1 then extracts gateway-specific order-total presentation without expanding\n// the compatibility shell.\n$acceptedGatewayBytes = 86457;\n"),
              ("    'process_admin_options' => 'gateway settings save entry point remains public',\n",
               "    'process_admin_options' => 'gateway settings save entry point remains public',\n    'add_order_item_totals' => 'order-total compatibility entry point remains public',\n"),
              ("arch_assert(arch_contains($gatewayAvailability, 'namespace Simplixi\\\\SUPCheckout\\\\Gateway;'), 'E1 Gateway Availability uses SUPCheckout Gateway namespace');\n",
               "arch_assert(arch_contains($gatewayAvailability, 'namespace Simplixi\\\\SUPCheckout\\\\Gateway;'), 'E1 Gateway Availability uses SUPCheckout Gateway namespace');\narch_assert(is_file($root . '/src/Gateway/OrderPresentation.php'), 'R1 Gateway OrderPresentation boundary exists');\narch_assert(arch_contains($gatewayOrderPresentation, 'namespace Simplixi\\\\SUPCheckout\\\\Gateway;'), 'R1 Gateway OrderPresentation uses SUPCheckout Gateway namespace');\n"),
              ("arch_assert(\n    arch_has_token_sequence(\n        $resolvedPublicMethods['process_payment']['body'],\n",
               "arch_assert(\n    arch_has_token_sequence(\n        $resolvedPublicMethods['add_order_item_totals']['body'],\n        array(\n            'return', 'name:OrderPresentation', '::', 'name:add_order_item_totals', '(',\n            'variable:$total_rows', ',', 'variable:$order', ',', 'variable:$this', '->', 'name:id', ')', ';',\n        )\n    ),\n    'WC_Upayments::add_order_item_totals directly delegates to R1 OrderPresentation'\n);\narch_assert(\n    arch_contains($gatewayOrderPresentation, 'get_payment_method()')\n        && arch_contains($gatewayOrderPresentation, 'UPayments_Result')\n        && arch_contains($gatewayOrderPresentation, 'UPayments_PaymentID'),\n    'R1 OrderPresentation keeps gateway identity guard and protected metadata ownership'\n);\narch_assert(\n    arch_has_token_sequence(\n        $resolvedPublicMethods['process_payment']['body'],\n"),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit('architecture replacement marker count != 1: ' + old[:100])
              s = s.replace(old, new)
          p.write_text(s, newline='\n')

          p = Path('phpstan.neon.dist')
          s = p.read_text()
          scan = "        - tests/phpstan/gateway-availability-stubs.php\n"
          path = "        - src/Gateway/Availability.php\n"
          if s.count(scan) != 1 or s.count(path) != 1:
              raise SystemExit('phpstan marker count mismatch')
          s = s.replace(scan, scan + "        - tests/phpstan/gateway-order-presentation-stubs.php\n")
          s = s.replace(path, path + "        - src/Gateway/OrderPresentation.php\n")
          p.write_text(s, newline='\n')

          p = Path('phpcs.xml.dist')
          s = p.read_text()
          marker = "    <file>src/Gateway/Availability.php</file>\n"
          if s.count(marker) != 1:
              raise SystemExit('phpcs marker count mismatch')
          s = s.replace(marker, marker + "    <file>src/Gateway/OrderPresentation.php</file>\n")
          p.write_text(s, newline='\n')
          PY

          cat > tests/phpstan/gateway-order-presentation-stubs.php <<'PHP'
          <?php

          /** Development-only WooCommerce order symbols for bounded PHPStan scope. */
          class WC_Order {
              /** @return string */
              public function get_payment_method() { return ''; }

              /** @return mixed */
              public function get_meta($key, $single = true) {}
          }
          PHP

          php -l tests/harness/architecture-foundation-harness.php
          php -l tests/phpstan/gateway-order-presentation-stubs.php
          php tests/harness/architecture-foundation-harness.php
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/harness/architecture-foundation-harness.php phpstan.neon.dist phpcs.xml.dist tests/phpstan/gateway-order-presentation-stubs.php
          git commit -m 'test: own extracted order presentation boundary'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
