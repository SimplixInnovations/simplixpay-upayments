name: Temporary R1 multi-merchant contract wiring

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening

permissions:
  contents: write

jobs:
  patch-r1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: 'composer:2.10.3'

      - name: Apply exact patch
        run: python3 scripts/temp-r1-multimerchant-contract-patch.py

      - name: Verify diff and PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 4
          git diff --name-only | grep -Fx 'UPayments.php'
          git diff --name-only | grep -Fx 'src/Admin/GatewaySettings.php'
          git diff --name-only | grep -Fx 'src/Payment/CheckoutOrchestrator.php'
          git diff --name-only | grep -Fx 'src/Payment/CheckoutPayload.php'
          php -l UPayments.php
          php -l src/Admin/GatewaySettings.php
          php -l src/Provider/MultiMerchantContract.php
          php -l src/Payment/CheckoutPayload.php
          php -l src/Payment/CheckoutOrchestrator.php

      - name: Verify unit and static stack
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          composer quality

      - name: Commit exact R1 wiring
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UPayments.php src/Admin/GatewaySettings.php src/Payment/CheckoutOrchestrator.php src/Payment/CheckoutPayload.php
          git diff --cached --check
          git commit -m 'fix: align multi-merchant admin and runtime contracts'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
