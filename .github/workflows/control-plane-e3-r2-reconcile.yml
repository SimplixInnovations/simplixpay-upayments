name: Guarded E3 to R2 control-plane reconciliation

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor == 'SimplixInnovationsAdmin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: true
          ref: audit/post-t3-ecosystem-hardening

      - name: Require expected parent and reconcile living state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e7ea3865331dd1d25560a1cc45851d24cecbc237"
          python3 - <<'PY'
          from pathlib import Path

          E3_SHA = '540b733c29656758f2392817649fc3d4a4db585d'
          E3_HASH = '01dbf672f9e18898a642a216b16fbf79dcc08511a617af9a8553d7341d87478c'
          OLD_SHA = '27e90d5a0cd2ba4f7c38889dbef15d1be851efb6'
          OLD_HASH = 'dc31c02a8047f9e5120650a46b9c16413383d6644b29f569573739a08f3e7a2d'

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_exact(path, old, new, count=None):
              text = read(path)
              actual = text.count(old)
              expected = 1 if count is None else count
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {actual}: {old[:100]!r}')
              write(path, text.replace(old, new))

          path = 'AGENTS.md'
          old = (
              f'The latest fully certified repository-executable generic E2 checkpoint inside PR #108 is `{OLD_SHA}`. '
              'Quality/H12, all 20 Compatibility cells plus Compatibility Gate, Provider Sandbox, WordPress.org Submission Check, Release Artifact and CodeQL succeeded at that exact head. '
              f'Its deterministic package is 55 files / SHA-256 `{OLD_HASH}`.'
          )
          new = (
              f'The latest repository-executable E3 runtime checkpoint inside PR #108 is `{E3_SHA}`. '
              'Quality/H12, all 20 Compatibility cells plus Compatibility Gate, Provider Sandbox, WordPress.org Submission Check, Release Artifact and the complete Ecosystem Certification matrix succeeded at that exact head. '
              'The E3 matrix covers five free parent themes with real child-theme template overrides, four legally runnable free cache/optimizer coexistence plugins, delayed/combined/repeated Classic script execution, and analytics-return replay characterization. '
              'The GitHub default CodeQL JavaScript/TypeScript job did not reach a terminal verdict at that historical checkpoint, so do not describe CodeQL as successful for that SHA. '
              f'Its deterministic package is 55 files / SHA-256 `{E3_HASH}`.'
          )
          replace_exact(path, old, new)
          replace_exact(
              path,
              'Current post-T3 state: R0, R1 and E1 are **DONE / VERIFIED** on PR #108; repository-executable generic E2 is **DONE / CERTIFIED** at the exact checkpoint above. Named paid/licensed vendor integrations remain external/unverified until separately qualified. The current executable gate is **E3 theme/cache/CDN/optimizer/analytics compatibility**, followed by R2 callback portability/cache safety, R3 subscription safety, R4 scalability/idempotency/observability, separately gated R5/T4 architecture decision, and R6 final exact-head qualification plus owner re-acceptance.',
              'Current post-T3 state: R0, R1 and E1 are **DONE / VERIFIED** on PR #108; repository-executable generic E2 is **DONE / CERTIFIED**; E3 repository-executable runtime evidence is **DONE / VERIFIED** at the exact checkpoint above. Named paid/licensed/vendor-infrastructure qualification remains external/unverified until actually exercised. The current executable gate is **R2 callback portability / cache safety**, followed by R3 subscription safety, R4 scalability/idempotency/observability, separately gated R5/T4 architecture decision, and R6 final exact-head qualification plus owner re-acceptance.'
          )

          path = 'docs/project/START-HERE.md'
          text = read(path)
          start = text.index('The latest fully certified repository-executable generic E2 checkpoint inside that PR is:')
          end_marker = 'That candidate does **not** redefine the accepted Approach 2 baseline.'
          end = text.index(end_marker, start) + len(end_marker)
          block = f'''The latest repository-executable E3 runtime checkpoint inside that PR is:

`{E3_SHA}`

At that exact SHA, Quality/H12, the full 20-cell Compatibility matrix + Compatibility Gate, Provider Sandbox Certification, WordPress.org Submission Check, Release Artifact and the complete Ecosystem Certification matrix succeeded. E3 repository automation covers five free themes plus real child-theme WooCommerce template overrides, four free cache/optimizer coexistence plugins, delayed/combined/repeated Classic interaction behavior, and analytics-return replay characterization.

GitHub default CodeQL JavaScript/TypeScript analysis did not reach a terminal verdict for this historical checkpoint; that hosted-security gap must not be rewritten as a success claim. Its deterministic package is 55 files / SHA-256 `{E3_HASH}`.

R0, R1 and E1 are **DONE / VERIFIED on the PR #108 branch**. Repository-executable generic E2 is **DONE / CERTIFIED**. E3 repository-executable runtime evidence is **DONE / VERIFIED** at this checkpoint. Named paid/licensed themes, paid optimizers, CDN/server-specific cache modes, browser/device visual evidence and named analytics deduplication remain external/manual unless actually exercised.

That candidate does **not** redefine the accepted Approach 2 baseline.'''
          text = text[:start] + block + text[end:]
          text = text.replace(f'| Latest fully certified runtime-content PR checkpoint | `{OLD_SHA}` |', f'| Latest repository-executable E3 runtime checkpoint | `{E3_SHA}` |')
          text = text.replace(f'| Latest candidate package at that checkpoint | 55 files / SHA-256 `{OLD_HASH}` |', f'| Latest candidate package at that checkpoint | 55 files / SHA-256 `{E3_HASH}` |')
          text = text.replace('| E2 repository-executable generic | **DONE / CERTIFIED** at `27e90d5a0cd2ba4f7c38889dbef15d1be851efb6` |\n| Current operational gate | **E3 theme/cache/CDN/optimizer/analytics compatibility** |', f'| E2 repository-executable generic | **DONE / CERTIFIED** |\n| E3 repository-executable | **DONE / VERIFIED** at `{E3_SHA}` |\n| Current operational gate | **R2 callback portability / cache safety** |')
          old_immediate = 'Execute **E3 theme/cache/CDN/optimizer/analytics compatibility** under the permanent Ecosystem Certification lane and existing checkout lifecycle harnesses. Keep named paid/licensed themes, optimizers and analytics products external/unverified unless their packages and required credentials are legally available. After E3 reaches an immutable exact-head checkpoint, continue to R2 callback portability/cache safety. Do not jump directly to R5/T4 callback consolidation.'
          new_immediate = 'Execute **R2 callback portability / cache safety** with TDD: replace hand-built callback origins with WooCommerce public API URL generation, cover home/site URL divergence and permalink/index layouts, and add explicit no-cache behavior to public payment callback/status surfaces. Preserve provider/payment authority and do not trust raw forwarded headers. Do not jump directly to R5/T4 callback consolidation.'
          if old_immediate not in text:
              raise SystemExit('START-HERE immediate-next-step source drift')
          text = text.replace(old_immediate, new_immediate)
          write(path, text)

          path = 'docs/project/PROJECT-STATUS.md'
          text = read(path)
          text = text.replace(f'| Latest fully certified runtime-content PR checkpoint | **`{OLD_SHA}`** |', f'| Latest repository-executable E3 runtime checkpoint | **`{E3_SHA}`** |')
          start = text.index('Latest fully certified repository-executable generic E2 checkpoint:')
          end_marker = 'That earlier checkpoint contains bounded post-T3 correctness work plus the accessibility markup slice.'
          end = text.index(end_marker, start)
          block = f'''Latest repository-executable E3 runtime checkpoint:

`{E3_SHA}`

At that exact SHA:

- Quality Gates / H12 — **SUCCESS**;
- Compatibility Certification — **20/20 runtime cells + Compatibility Gate SUCCESS**;
- Ecosystem Certification — **five free parent themes + real child-theme overrides, four free cache/optimizer coexistence lanes, E2 current-runtime legacy+HPOS lanes + Ecosystem Gate SUCCESS**;
- Provider Sandbox Certification — **SUCCESS**;
- WordPress.org Submission Check — **SUCCESS**;
- Release Artifact — **SUCCESS**;
- analytics-return characterization — **27 PASS / 0 FAIL**;
- deterministic installable package — **55 files**, SHA-256 `{E3_HASH}`.

GitHub default CodeQL JavaScript/TypeScript analysis did not reach a terminal verdict for this historical SHA. Do not promote that nonterminal hosted check to success; descendant exact-head qualification still requires CodeQL/security green before merge or release.

R0, R1 and E1 are **DONE / VERIFIED on the PR #108 branch**. Repository-executable generic E2 is **DONE / CERTIFIED**. E3 repository-executable runtime evidence is **DONE / VERIFIED** at this exact checkpoint. Named paid/licensed themes/plugins, CDN/server-specific full-page cache modes, broad browser/device/accessibility evidence and third-party analytics deduplication remain external/manual until actually qualified. The earlier b069 accessibility checkpoint remains retained historical evidence inside this descendant.

'''
          text = text[:start] + block + text[end:]
          text = text.replace(f'Repository-executable generic E2 is **DONE / CERTIFIED** at `{OLD_SHA}`. This covers the repository-owned generic economics/product/shipping/tax/composition/refund boundaries, including the current-runtime legacy+HPOS Ecosystem Certification lane. It does **not** convert unavailable paid/licensed named integrations into certified compatibility.\n\nCurrent executable gate: **E3 theme/cache/CDN/optimizer/analytics compatibility**.', 'Repository-executable generic E2 is **DONE / CERTIFIED**. E3 repository-executable runtime evidence is **DONE / VERIFIED** at the checkpoint above. These results do **not** convert unavailable paid/licensed or server/CDN-specific integrations into certified compatibility.\n\nCurrent executable gate: **R2 callback portability / cache safety**.')
          write(path, text)

          path = 'docs/project/OWNER-HANDOFF.md'
          text = read(path)
          if OLD_SHA not in text or OLD_HASH not in text:
              raise SystemExit('OWNER-HANDOFF expected old E2 coordinate missing')
          text = text.replace(OLD_SHA, E3_SHA)
          text = text.replace(OLD_HASH, E3_HASH)
          text = text.replace('latest fully certified repository-executable generic E2 checkpoint', 'latest repository-executable E3 runtime checkpoint')
          text = text.replace('Current executable gate: **E3 theme/cache/CDN/optimizer/analytics compatibility**.', 'Current executable gate: **R2 callback portability / cache safety**.')
          write(path, text)

          path = 'docs/project/NEW-CHAT-HANDOFF.md'
          text = read(path)
          text = text.replace('## Latest fully certified repository-executable generic E2 checkpoint', '## Latest repository-executable E3 runtime checkpoint')
          text = text.replace(OLD_SHA, E3_SHA)
          text = text.replace(OLD_HASH, E3_HASH)
          text = text.replace('R0, R1 and E1 are **DONE / VERIFIED on PR #108 branch**. Repository-executable generic E2 is **DONE / CERTIFIED** at this checkpoint, including current-runtime legacy+HPOS Ecosystem Certification. Named paid/licensed vendor integrations remain external/unverified until separately qualified.', 'R0, R1 and E1 are **DONE / VERIFIED on PR #108 branch**. Repository-executable generic E2 is **DONE / CERTIFIED**. E3 repository-executable runtime evidence is **DONE / VERIFIED** at this checkpoint: five free themes with child-theme overrides, four free cache/optimizer coexistence lanes, delayed/combined/repeated script behavior, and analytics-return replay characterization. Named paid/licensed, CDN/server-specific and broad browser/device integrations remain external/unverified until separately qualified. GitHub default CodeQL JavaScript/TypeScript did not reach a terminal verdict at this historical SHA, so descendant merge/release qualification still requires security green.')
          text = text.replace('Current executable gate: **E3 theme/cache/CDN/optimizer/analytics compatibility**.', 'Current executable gate: **R2 callback portability / cache safety**.')
          text = text.replace('1. Execute **E3** repository-owned theme/cache/CDN/optimizer/analytics behavior against legally available runtimes; keep unavailable paid/licensed named products explicitly external/unverified.\n2. Execute **R2** callback URL portability/no-cache safety.', '1. Execute **R2** callback URL portability/no-cache safety with WooCommerce public API URL generation, subdirectory/permalink/proxy coverage and explicit no-cache response semantics.\n2. Execute **R3** subscription selected-card/identity/economic safety after R2 closes.')
          text = text.replace('3. Execute **R3** subscription safety:', '3. Continue **R3** subscription safety:')
          write(path, text)

          path = '.ai-architect/implementation-plan.md'
          text = read(path)
          text = text.replace('- E2 repository-executable generic — **DONE / CERTIFIED**.\n\nRepository-executable generic E2 exact-head checkpoint: `' + OLD_SHA + '`.', '- E2 repository-executable generic — **DONE / CERTIFIED**.\n- E3 repository-executable runtime evidence — **DONE / VERIFIED**.\n\nE3 repository-executable exact-head checkpoint: `' + E3_SHA + '`.')
          text = text.replace('At that exact head, Quality/H12, all 20 Compatibility cells + Compatibility Gate, Provider Sandbox, WordPress.org Submission Check, Release Artifact and CodeQL were successful; deterministic candidate package: 55 files / SHA-256 `' + OLD_HASH + '`.', 'At that exact E3 head, Quality/H12, all 20 Compatibility cells + Compatibility Gate, Provider Sandbox, WordPress.org Submission Check, Release Artifact and the complete Ecosystem Certification matrix were successful; deterministic candidate package: 55 files / SHA-256 `' + E3_HASH + '`. GitHub default CodeQL JavaScript/TypeScript did not reach a terminal verdict for that historical SHA, so descendant merge/release qualification still requires CodeQL/security green.')
          text = text.replace('Current executable gate: **E3 theme/cache/CDN/optimizer/analytics compatibility**. Repository-executable generic E2 is closed/certified; named paid/licensed integrations remain external until actually qualified. Then execute R2 callback URL portability/no-cache safety;', 'Current executable gate: **R2 callback portability / cache safety**. Repository-executable generic E2 is closed/certified and E3 repository-executable runtime evidence is done/verified; named paid/licensed and infrastructure-specific integrations remain external until actually qualified. Execute R2 callback URL portability/no-cache safety;')
          write(path, text)

          path = '.ai-architect/architecture-contract.yaml'
          text = read(path)
          needle = f'    generic_e2_status: done_certified\n    current_gate: e3-theme-cache-analytics\n'
          replacement = f'    generic_e2_status: done_certified\n    latest_e3_runtime_checkpoint: {E3_SHA}\n    latest_e3_package_sha256: {E3_HASH}\n    latest_e3_package_files: 55\n    e3_repository_status: done_verified\n    e3_codeql_historical_status: nonterminal_hosted_default_setup\n    current_gate: r2-callback-portability-cache-safety\n'
          if needle not in text:
              raise SystemExit('architecture contract current gate source drift')
          text = text.replace(needle, replacement)
          text = text.replace('goal: Qualify E3 theme/cache/CDN/optimizer/analytics behavior, then close portability, subscription and scalability gaps under the post-T3 plan; do not treat T3 as authorization for T4 consolidation.', 'goal: Close R2 callback portability/cache safety, then subscription and scalability gaps under the post-T3 plan; keep external E3 vendor/infrastructure evidence bounded and do not treat T3 as authorization for T4 consolidation.')
          write(path, text)

          path = 'docs/COMPATIBILITY.md'
          text = read(path)
          anchor_start = text.index('## Current runtime certification anchor')
          anchor_end = text.index('### Current-stack and pre-acceptance hardening', anchor_start)
          anchor = f'''## Current runtime certification anchor

Latest repository-executable E3 runtime checkpoint in draft PR #108:

`{E3_SHA}`

Exact checkpoint evidence:

- Quality/H12 — **SUCCESS**;
- Compatibility Certification — full 20-cell runtime matrix + **Compatibility Gate SUCCESS**;
- Ecosystem Certification — **SUCCESS** across five free themes with real child-theme overrides, four free cache/optimizer coexistence plugins, and current-runtime legacy+HPOS economics lanes;
- delayed/combined/repeated Classic script harness — **26 PASS / 0 FAIL**;
- analytics-return replay characterization — **27 PASS / 0 FAIL**;
- Release Gate — **SUCCESS**;
- Provider Sandbox — **SUCCESS**;
- WordPress.org packaged Plugin Check — **SUCCESS**;
- deterministic current candidate package — **55 files**, SHA-256 `{E3_HASH}`, byte-identical across canonical/Linux/Windows evidence.

The GitHub default CodeQL JavaScript/TypeScript job did not reach a terminal verdict for this historical checkpoint. This matrix therefore describes the repository-executable runtime evidence actually proven at that SHA and does not misstate the hosted security check as successful. Exact descendant merge/release qualification still requires CodeQL/security green.

Owner technical acceptance remains **ACCEPTED** only for the frozen **Approach 2 regression reference** `0c883d609906676966002eb022a82a9656eeacc5` and accepted package SHA-256 `58eba75019416f39a09211c87e7ccbcbb635834fb20bc890e9efbd5fec859655`. The E3 checkpoint does not redefine owner acceptance. Publication remains unauthorized.

'''
          text = text[:anchor_start] + anchor + text[anchor_end:]
          text = text.replace('| Browser/device/theme interoperability | **External/manual** | Server-side CI does not prove rendering/input behavior. |', '| Free-theme WooCommerce runtime interoperability | **Verified — bounded** | Twenty Twenty-Five 1.5, Storefront 4.6.2, Astra 4.13.11, Blocksy 2.1.56 and Kadence 1.5.2, including real child-theme WooCommerce template override precedence, server-side checkout validation and finalized economics. |\n| Free cache/optimizer plugin coexistence | **Verified — bounded** | LiteSpeed Cache 7.9.1, W3 Total Cache 2.10.6, Breeze 2.5.13 and SiteGround Speed Optimizer 7.8.2 activated on the CI runtime; proves coexistence contracts, not every vendor optimization mode or server cache. |\n| Delayed/combined/repeated Classic JS lifecycle | **Verified — bounded** | First-interaction delayed script queueing, duplicate/combined evaluation handler ownership and repeated Woo checkout fragment lifecycle are permanent harness contracts. |\n| Analytics return/replay behavior | **Verified — characterization** | Replayed verified browser callbacks do not mutate payment state and repeat the same order-received navigation; SUPCheckout emits no tested GA/Meta/GTM purchase API itself. Downstream tracker deduplication is not owned by SUPCheckout. |\n| Broad browser/device/theme visual interoperability | **External/manual** | Repository automation does not prove visual rendering, focus, device wallets or proprietary theme modes beyond the named bounded free-theme runtime checks. |')
          write(path, text)
          PY

          rm -f .github/workflows/control-plane-e3-r2-reconcile.yml
          git diff --check
          git status --short

      - name: Commit reconciled control plane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Simplix Innovations"
          git config user.email "136711735+SimplixInnovationsAdmin@users.noreply.github.com"
          git add AGENTS.md docs/COMPATIBILITY.md docs/project/START-HERE.md docs/project/PROJECT-STATUS.md docs/project/OWNER-HANDOFF.md docs/project/NEW-CHAT-HANDOFF.md .ai-architect/implementation-plan.md .ai-architect/architecture-contract.yaml .github/workflows/control-plane-e3-r2-reconcile.yml
          git commit -m "docs(control-plane): close E3 evidence and advance R2"
          git push origin HEAD:audit/post-t3-ecosystem-hardening
