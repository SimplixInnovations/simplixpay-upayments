name: Closure History Chain Once

on:
  push:
    branches:
      - docs/security-threat-model-closure

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/security-threat-model-closure
          fetch-depth: 0

      - name: Reconcile earlier closed-gate handoffs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          phase0 = 'docs/project/PHASE-0-RELEASE-IDENTITY.md'
          replace_once(phase0,
              'This gate does **not** mean the plugin is broadly production-certified. It closes release-identity/updater ownership only. Subsequent migration, payment-lifecycle, security, architecture, compatibility and release-certification phases remain required.',
              'This gate does **not** mean the plugin is broadly production-certified. It closes release-identity/updater ownership only. At Phase 0 closure, migration, payment-lifecycle, security, architecture, compatibility and release-certification phases still remained. Phase 9I, Provider Contract & Payment Lifecycle, and the bounded Security Threat-Model Closure have since become **DONE / VERIFIED**; **Architecture & Code-Quality Foundation — DISCOVERY** is the current program gate.',
              'phase0 outcome chronology')
          replace_once(phase0,
              'The next permitted implementation gate is **Phase 9I — Historical token-identity migration**, under the frozen H12 identity/provider contracts and the normal protected-branch review/CI rules.',
              'The implementation gate immediately following Phase 0 was **Phase 9I — Historical token-identity migration**. Phase 9I, Provider Contract & Payment Lifecycle, and the bounded Security Threat-Model Closure are now **DONE / VERIFIED**; the current permitted gate is **Architecture & Code-Quality Foundation — DISCOVERY**, under the same protected-branch review/CI discipline and frozen compatibility contracts.',
              'phase0 exit chronology')

          readiness = 'docs/project/REPOSITORY-READINESS.md'
          replace_once(readiness,
              '> **Gate status: PRE-PHASE-0 READY / VERIFIED.** Phase 0 is now permitted under the repository\'s normal PR/CI/review controls.',
              '> **Gate status: PRE-PHASE-0 READY / VERIFIED.** At this gate\'s closure, Phase 0 became permitted under the repository\'s normal PR/CI/review controls. Phase 0, Phase 9I, Provider Contract & Payment Lifecycle, and the bounded Security Threat-Model Closure are now **DONE / VERIFIED**; **Architecture & Code-Quality Foundation — DISCOVERY** is the current program gate.',
              'readiness opening chronology')
          replace_once(readiness,
              'After this closing PR merges, the local clone will be one fast-forward behind until `git pull --ff-only origin main` is run. That expected post-merge fast-forward does not reopen repository readiness.',
              'At readiness closure, the local clone was expected to become one fast-forward behind after the closing PR merged until `git pull --ff-only origin main` was run. That historical post-merge fast-forward did not reopen repository readiness.',
              'readiness local-clone chronology')
          replace_once(readiness,
              'The next permitted runtime-changing work is **Phase 0 — SimplixPay release identity and updater ownership**.',
              'The runtime-changing gate immediately following repository readiness was **Phase 0 — SimplixPay release identity and updater ownership**. Phase 0, Phase 9I, Provider Contract & Payment Lifecycle, and the bounded Security Threat-Model Closure are now **DONE / VERIFIED**; the current permitted program gate is **Architecture & Code-Quality Foundation — DISCOVERY**.',
              'readiness result chronology')

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'the current permitted gate is **Architecture & Code-Quality Foundation — DISCOVERY**' docs/project/PHASE-0-RELEASE-IDENTITY.md
          grep -Fq 'the current permitted program gate is **Architecture & Code-Quality Foundation — DISCOVERY**' docs/project/REPOSITORY-READINESS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project/PHASE-0-RELEASE-IDENTITY.md docs/project/REPOSITORY-READINESS.md
          git commit -m 'docs: make earlier closed-gate handoffs historical'
          git push origin HEAD:docs/security-threat-model-closure
