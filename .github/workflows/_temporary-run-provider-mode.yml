name: Temporary provider-mode fix runner

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - .github/workflows/_temporary-run-provider-mode.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Apply provider-environment fail-safe correction
        run: |
          set -euo pipefail
          test "$(git hash-object UPayments.php)" = "8586a1eac12e9099c30eb605f32eea690ba9c118"
          python3 scripts/_temporary_apply_provider_mode.py
          php -l UPayments.php
          php tests/harness/architecture-foundation-harness.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UPayments.php tests/harness/architecture-foundation-harness.php
          git commit -m 'fix: fail safe provider environment selection'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
