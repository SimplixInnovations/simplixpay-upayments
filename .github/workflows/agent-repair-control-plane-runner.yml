name: Agent Repair Control Plane Runner

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - '.github/workflows/agent-repair-control-plane-runner.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
      - name: Repair helper and self-remove
        shell: bash
        run: |
          set -euo pipefail
          BASE=5d8d954ffb8c2e6646dadc4aa1f994b5d56c462e
          PRIMARY=.github/workflows/agent-control-plane-e2-reconcile.yml
          SELF=.github/workflows/agent-repair-control-plane-runner.yml
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t changed < <(git diff --name-only "$BASE"..HEAD | sort)
          expected=("$PRIMARY" "$SELF")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/agent-control-plane-e2-reconcile.yml')
          s=p.read_text()
          old="          php-version: '8.3'"
          new="          php-version: '8.5'"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one helper PHP lane, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git rm "$SELF"
          git diff --check
          test "$(git diff --name-only "$BASE" | tr -d '\r')" = "$PRIMARY"
          grep -Fq "php-version: '8.5'" "$PRIMARY"
          ! grep -Fq "php-version: '8.3'" "$PRIMARY"
          git config user.name 'supcheckout-control-plane-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add "$PRIMARY"
          git commit -m 'ci: align control-plane helper with PHP 8.5'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
