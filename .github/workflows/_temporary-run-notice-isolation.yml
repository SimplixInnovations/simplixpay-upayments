name: Temporary notice-isolation fix runner

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening
    paths:
      - .github/workflows/_temporary-run-notice-isolation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Apply notice-isolation correction
        run: |
          set -euo pipefail
          test "$(git hash-object UPayments.php)" = "747d8e04b87c8b73db93aa68e916a951e304047e"
          python3 scripts/_temporary_apply_notice_isolation.py
          php -l UPayments.php
          php tests/harness/architecture-foundation-harness.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UPayments.php tests/harness/architecture-foundation-harness.php
          git commit -m 'fix: preserve foreign WooCommerce notices'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
