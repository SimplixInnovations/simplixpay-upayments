name: Agent E2 Final Generic Executor

on:
  push:
    branches:
      - audit/post-t3-ecosystem-hardening

permissions:
  contents: write

jobs:
  apply-and-certify:
    if: github.event.head_commit.message == 'stage-final-generic-e2-executor-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/post-t3-ecosystem-hardening
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: curl, mbstring, mysqli, zip
          coverage: none
          tools: none

      - name: Apply durable E2 probes only
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/agent-e2-final-generic.py
          git checkout -- .github/workflows/compatibility-certification.yml
          git rm .github/agent-e2-final-generic.py
          git add tests/integration/OrderEconomicsRuntimeTest.php tests/integration/CheckoutValidationBoundaryRuntimeTest.php
          git diff --cached --name-only | sort > /tmp/changed-files
          printf '%s\n' ".github/agent-e2-final-generic.py" "tests/integration/CheckoutValidationBoundaryRuntimeTest.php" "tests/integration/OrderEconomicsRuntimeTest.php" | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/changed-files
          test -z "$(git diff --name-only)"

      - name: Install pinned WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar \
            -o /tmp/wp-cli.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum -c -
          chmod +x /tmp/wp-cli.phar

      - name: Install real WordPress and WooCommerce runtime
        env:
          WP_CLI_BIN: /tmp/wp-cli.phar
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-wp-test-environment.sh "7.1" "11.1.0" "$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar plugin activate supcheckout --path="$RUNNER_TEMP/wordpress"

      - name: Run focused real-Woo E2 probes
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/OrderEconomicsRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"
          /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/CheckoutValidationBoundaryRuntimeTest.php" --path="$RUNNER_TEMP/wordpress"

      - name: Commit durable evidence and helper cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/agent-e2-final-generic.py' 'tests/integration/CheckoutValidationBoundaryRuntimeTest.php' 'tests/integration/OrderEconomicsRuntimeTest.php' | sort)"
          test "$staged" = "$expected"
          git config user.name 'supcheckout-e2-agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'test(e2): close final generic Woo economics boundaries'
          git push origin HEAD:audit/post-t3-ecosystem-hardening
