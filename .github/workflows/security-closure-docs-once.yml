name: Security Closure Docs Once

on:
  push:
    branches:
      - docs/security-threat-model-closure

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/security-threat-model-closure
          fetch-depth: 0

      - name: Recover and run exact closure migration
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          source = subprocess.check_output([
              'git', 'show',
              '16cdcef1ad9f46c7aed1b43654a5cd919e0213f9:.github/workflows/security-closure-docs-once.yml'
          ], text=True)
          start_marker = '      - name: Reconcile permanent project control plane\n        shell: python\n        run: |\n'
          end_marker = '      - name: Verify closure reconciliation and commit\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('closure source markers changed')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          code_lines = []
          for line in body.splitlines():
              code_lines.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(code_lines) + '\n'
          script = Path('/tmp/security-closure.py')
          script.write_text(code, encoding='utf-8')
          compiled = compile(code, str(script), 'exec')
          exec(compiled, {'__name__': '__main__'})

          harness_path = Path('tests/harness/security-threat-model-harness.php')
          harness = harness_path.read_text(encoding='utf-8')
          old = "sec_assert(strpos($security_doc, '**Status:** IMPLEMENTATION / REVIEW') !== false, 'security threat-model record tracks in-flight tranche status');"
          new = "sec_assert(strpos($security_doc, '**Status:** DONE / VERIFIED') !== false, 'security threat-model record tracks verified closed status');"
          if harness.count(old) != 1:
              raise SystemExit(f'security harness closure-status contract changed: {harness.count(old)}')
          harness_path.write_text(harness.replace(old, new, 1), encoding='utf-8')

      - name: Verify closure reconciliation and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          php -l tests/harness/security-threat-model-harness.php
          php tests/harness/security-threat-model-harness.php
          grep -Fq '**Status:** DONE / VERIFIED' docs/project/SECURITY-THREAT-MODEL.md
          grep -Fq '| Security Threat-Model Closure | **DONE / VERIFIED** |' docs/project/PROJECT-STATUS.md
          grep -Fq '| Current program gate | **Architecture & Code-Quality Foundation — DISCOVERY** |' docs/project/PROJECT-STATUS.md
          grep -Fq 'Architecture & Code-Quality Foundation — DISCOVERY' docs/project/NEW-CHAT-HANDOFF.md
          grep -Fq 'Security Threat-Model Closure: DONE / VERIFIED' docs/project/MASTER-ENGINEERING-PLAYBOOK.md
          grep -Fq 'Security threat-model harness | **81 PASS / 0 FAIL**' README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md CHANGELOG.md docs/ENGINEERING-ROADMAP.md docs/project/PROJECT-STATUS.md docs/project/NEW-CHAT-HANDOFF.md docs/project/MASTER-ENGINEERING-PLAYBOOK.md docs/project/REPOSITORY-AUDIT.md docs/project/SECURITY-THREAT-MODEL.md .github/workflows/quality-gates.yml tests/harness/security-threat-model-harness.php
          git diff --cached --quiet && exit 0
          git commit -m 'docs: close security threat-model gate and advance architecture'
          git push origin HEAD:docs/security-threat-model-closure