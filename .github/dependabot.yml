version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    reviewers:
      - SimplixInnovationsAdmin
    groups:
      github-actions:
        patterns:
          - "*"
