name: Feature request
description: Propose a reliability, compatibility, maintainability, UX or operational improvement.
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or merchant need
      description: Describe the real problem; avoid prescribing implementation unless necessary.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Payment / compatibility impact
      description: Note Classic/Blocks, HPOS, WPML, saved cards, subscriptions, wallets, multi-merchant, refunds or upgrade behavior.
  - type: textarea
    id: context
    attributes:
      label: Additional context
