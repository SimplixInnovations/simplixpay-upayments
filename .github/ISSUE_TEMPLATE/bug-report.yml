name: Bug report
description: Report a reproducible defect in SimplixPay for UPayments.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Provide a minimal reproducible issue. Never include API keys, bearer tokens, card data, customer tokens, PII, database exports, or production secrets. Security findings must follow SECURITY.md.
  - type: input
    id: plugin-version
    attributes:
      label: SimplixPay version or commit
      placeholder: "Version or full commit SHA"
    validations:
      required: true
  - type: input
    id: wordpress
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: woocommerce
    attributes:
      label: WooCommerce version
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
    validations:
      required: true
  - type: dropdown
    id: checkout
    attributes:
      label: Checkout mode
      options:
        - Classic Checkout
        - Cart/Checkout Blocks
        - Not checkout-related
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: hpos
    attributes:
      label: HPOS
      options:
        - Enabled
        - Disabled
        - Unknown
    validations:
      required: true
  - type: input
    id: wpml
    attributes:
      label: WPML / multilingual setup
      placeholder: "Not installed, or exact relevant versions"
  - type: input
    id: theme
    attributes:
      label: Theme and version
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Logs/stack traces/screenshots with secrets, tokens and PII removed.
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data confirmation
      options:
        - label: I removed credentials, tokens, card data, PII and production secrets.
          required: true
