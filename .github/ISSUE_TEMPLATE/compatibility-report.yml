name: Compatibility report
description: Report a reproducible platform/plugin/theme compatibility issue.
title: "[Compatibility]: "
labels: []
body:
  - type: markdown
    attributes:
      value: Compatibility claims are evidence-based. Provide exact versions and a reproducible result; do not include sensitive data.
  - type: input
    id: component
    attributes:
      label: Compatibility area
      placeholder: "PHP, WooCommerce, WPML, HPOS, Blocks, theme, browser, etc."
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Exact environment
      description: WordPress, WooCommerce, PHP, SimplixPay commit/version, relevant plugins/theme/browser.
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Runtime state
      description: Checkout mode, HPOS, multilingual/multicurrency, payment feature, cache/proxy details if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Test procedure and result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
